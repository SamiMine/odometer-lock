          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.odometer.lock.LockNotification
          import com.odometer.lock.NotificationStore
          import com.odometer.lock.Prefs
          import kotlinx.coroutines.delay
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Locale

          @Composable
          fun LockScreenUi(
              onUnlock: () -> Unit,
              onStep: () -> Unit
          ) {
              val context = LocalContext.current
              val notifications by NotificationStore.notifications.collectAsState()
              var hidden by remember { mutableStateOf(false) }
              var odometerValue by remember { mutableIntStateOf(Prefs.odometerValue) }
              val maxValue = remember { Prefs.maxValue }
              var now by remember { mutableStateOf(Calendar.getInstance()) }
              var triggered by remember { mutableStateOf(false) }

              LaunchedEffect(Unit) {
                  while (true) { delay(1000); now = Calendar.getInstance() }
              }

              LaunchedEffect(odometerValue) {
                  if (odometerValue >= maxValue && !triggered) {
                      triggered = true
                      delay(400)
                      onUnlock()
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(
                          Brush.verticalGradient(
                              listOf(Color(0xFF1A0A00), Color(0xFF080808), Color(0xFF000000))
                          )
                      )
              ) {
                  Column(modifier = Modifier.fillMaxSize().padding(24.dp)) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.End,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          if (notifications.isNotEmpty()) {
                              Text(
                                  "" + notifications.size,
                                  color = Color(0xFFFF6B35),
                                  fontSize = 14.sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Spacer(Modifier.width(4.dp))
                              Icon(
                                  Icons.Default.Notifications,
                                  contentDescription = null,
                                  tint = Color(0xFFFF6B35),
                                  modifier = Modifier.size(20.dp)
                              )
                              Spacer(Modifier.width(8.dp))
                          }
                          IconButton(onClick = { hidden = !hidden }) {
                              Icon(
                                  imageVector = if (hidden) Icons.Default.VisibilityOff
                                                else Icons.Default.Visibility,
                                  contentDescription = "Toggle",
                                  tint = Color(0xFFFF6B35)
                              )
                          }
                      }

                      LazyColumn(
                          modifier = Modifier.weight(1f).fillMaxWidth(),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          item {
                              Column(
                                  modifier = Modifier.fillMaxWidth().padding(vertical = 16.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  val hhmm = SimpleDateFormat("HH:mm", Locale.getDefault()).format(now.time)
                                  Text(
                                      hhmm, color = Color.White,
                                      fontSize = 96.sp, fontWeight = FontWeight.Thin
                                  )
                                  val day = SimpleDateFormat("EEEE", Locale.US).format(now.time)
                                  val date = SimpleDateFormat("d MMMM", Locale.US).format(now.time)
                                  Text("" + day + ", " + date, color = Color(0xFFAAAAAA), fontSize = 16.sp)
                              }
                          }

                          if (!hidden) {
                              items(notifications) { n ->
                                  NotificationCard(n, showContent = Prefs.showNotificationContent)
                              }
                          }
                      }

                      Column(
                          modifier = Modifier.fillMaxWidth().padding(top = 8.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text(
                              "ODOMETER",
                              color = Color(0xFF888888),
                              fontSize = 12.sp,
                              letterSpacing = 4.sp
                          )
                          Spacer(Modifier.height(6.dp))

                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              OdometerSection(
                                  value = odometerValue,
                                  maxValue = maxValue,
                                  onValueChange = {
                                      odometerValue = it
                                      Prefs.odometerValue = it
                                  },
                                  onStep = onStep
                              )
                          }

                          Spacer(Modifier.height(4.dp))
                          Text(
                              "Swipe up to increase",
                              color = Color(0xFF666666),
                              fontSize = 11.sp
                          )
                      }

                      Spacer(Modifier.height(16.dp))

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceEvenly,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(
                                  modifier = Modifier
                                      .size(64.dp)
                                      .clip(CircleShape)
                                      .background(Color(0x22FF6B35))
                                      .clickable { onUnlock() },
                                  contentAlignment = Alignment.Center
                              ) {
                                  Icon(
                                      Icons.Default.Fingerprint,
                                      contentDescription = "Fingerprint",
                                      tint = Color(0xFFFF6B35),
                                      modifier = Modifier.size(36.dp)
                                  )
                              }
                              Spacer(Modifier.height(4.dp))
                              Text("Fingerprint / PIN", color = Color(0xFFAAAAAA), fontSize = 11.sp)
                          }

                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(
                                  modifier = Modifier
                                      .size(56.dp)
                                      .clip(CircleShape)
                                      .background(Color(0x22FF4444))
                                      .clickable {
                                          context.startActivity(
                                              Intent(Intent.ACTION_DIAL).apply {
                                                  data = Uri.parse("tel:112")
                                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                              }
                                          )
                                      },
                                  contentAlignment = Alignment.Center
                              ) {
                                  Icon(
                                      Icons.Default.Phone,
                                      contentDescription = "Emergency",
                                      tint = Color(0xFFFF4444),
                                      modifier = Modifier.size(28.dp)
                                  )
                              }
                              Spacer(Modifier.height(4.dp))
                              Text("Emergency", color = Color(0xFFAAAAAA), fontSize = 11.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun NotificationCard(notification: LockNotification, showContent: Boolean) {
              Card(
                  modifier = Modifier.fillMaxWidth(),
                  colors = CardDefaults.cardColors(containerColor = Color(0x1AFFFFFF)),
                  shape = RoundedCornerShape(16.dp)
              ) {
                  Row(
                      modifier = Modifier.padding(12.dp).fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              notification.appName,
                              color = Color(0xFFFF6B35),
                              fontSize = 11.sp,
                              fontWeight = FontWeight.Medium
                          )
                          Text(
                              notification.title,
                              color = Color.White,
                              fontSize = 14.sp,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          if (showContent && notification.text.isNotEmpty()) {
                              Text(
                                  notification.text,
                                  color = Color(0xFFAAAAAA),
                                  fontSize = 12.sp,
                                  maxLines = 2,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                      }
                  }
              }
          }
