      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt/
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          /opt/gradle-8.7/bin/gradle --version

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd $GITHUB_WORKSPACE
          /opt/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: odometer-lock-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload source code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odometer-lock-source
          path: |
            app
            build.gradle
            settings.gradle
            gradle.properties
