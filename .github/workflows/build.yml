name: Build Odometer Lock

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/odometer/lock
          mkdir -p app/src/main/res/values

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "OdometerLock"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.odometer.lock'
              compileSdk 34
              defaultConfig {
                  applicationId "com.odometer.lock"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion = '1.5.8' }
          }
          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:name=".LockApp"
                  android:label="Odometer Lock"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".LockActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleInstance"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true" />
                  <activity android:name=".SettingsActivity" android:exported="false" />
                  <service
                      android:name=".LockScreenService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="lock_screen" />
                  </service>
                  <service
                      android:name=".NotificationService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Odometer Lock</string></resources>
          EOF

          cat > app/src/main/java/com/odometer/lock/Core.kt << 'EOF'
          package com.odometer.lock

          import android.app.*
          import android.content.*
          import android.os.*
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.asStateFlow

          class LockApp : Application() {
              override fun onCreate() { super.onCreate(); Prefs.init(this) }
          }

          object Prefs {
              private lateinit var sp: SharedPreferences
              fun init(c: Context) { sp = c.getSharedPreferences("odometer_prefs", Context.MODE_PRIVATE) }
              var odometerValue: Int get() = sp.getInt("val", 0); set(v) = sp.edit().putInt("val", v).apply()
              var maxValue: Int get() = sp.getInt("max", 9999); set(v) = sp.edit().putInt("max", v).apply()
              var vibrationEnabled: Boolean get() = sp.getBoolean("vib", true); set(v) = sp.edit().putBoolean("vib", v).apply()
              var soundEnabled: Boolean get() = sp.getBoolean("snd", true); set(v) = sp.edit().putBoolean("snd", v).apply()
              var showContent: Boolean get() = sp.getBoolean("cnt", true); set(v) = sp.edit().putBoolean("cnt", v).apply()
              var lockEnabled: Boolean get() = sp.getBoolean("lck", true); set(v) = sp.edit().putBoolean("lck", v).apply()
          }

          data class LockNotification(val key: String, val appName: String, val title: String, val text: String)

          object NotificationStore {
              private val _list = MutableStateFlow<List<LockNotification>>(emptyList())
              val list = _list.asStateFlow()
              fun add(n: LockNotification) {
                  val cur = _list.value.toMutableList()
                  val idx = cur.indexOfFirst { it.key == n.key }
                  if (idx >= 0) cur[idx] = n else cur.add(0, n)
                  _list.value = cur.take(15)
              }
              fun remove(key: String) { _list.value = _list.value.filterNot { it.key == key } }
          }

          class NotificationService : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName || (sbn.notification.flags and Notification.FLAG_ONGOING_EVENT != 0)) return
                  val title = sbn.notification.extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = sbn.notification.extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val name = try { packageManager.getApplicationLabel(packageManager.getApplicationInfo(sbn.packageName, 0)).toString() } catch (e: Exception) { sbn.packageName }
                  NotificationStore.add(LockNotification(sbn.key ?: "", name, title, text))
              }
              override fun onNotificationRemoved(sbn: StatusBarNotification) { NotificationStore.remove(sbn.key ?: "") }
          }

          class LockScreenService : Service() {
              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action == Intent.ACTION_SCREEN_ON && Prefs.lockEnabled) {
                          val km = getSystemService(KeyguardManager::class.java)
                          if (km?.isKeyguardLocked == true) {
                              startActivity(Intent(context, LockActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                              })
                          }
                      }
                  }
              }
              override fun onCreate() {
                  super.onCreate()
                  val chanId = "odometer_lock_chan"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(
                          NotificationChannel(chanId, "Lock Service", NotificationManager.IMPORTANCE_MIN)
                      )
                  }
                  startForeground(1, NotificationCompat.Builder(this, chanId)
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setContentTitle("Odometer Lock Active").build())
                  val filter = IntentFilter(Intent.ACTION_SCREEN_ON)
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(receiver, filter)
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int) = START_STICKY
              override fun onBind(intent: Intent?) = null
              override fun onDestroy() { try { unregisterReceiver(receiver) } catch (e: Exception) {}; super.onDestroy() }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  Prefs.init(context)
                  if (Prefs.lockEnabled) {
                      val i = Intent(context, LockScreenService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(i) else context.startService(i)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/odometer/lock/MainActivity.kt << 'EOF'
          package com.odometer.lock

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val ctx = LocalContext.current
                      var hasOverlay by remember { mutableStateOf(Settings.canDrawOverlays(ctx)) }
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              Column(modifier = Modifier.padding(24.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                  Text("Odometer Lock", style = MaterialTheme.typography.headlineMedium)
                                  Text("Car odometer lock screen. Grant permissions to start:")

                                  Button(onClick = {
                                      ctx.startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:${ctx.packageName}")))
                                  }, modifier = Modifier.fillMaxWidth()) {
                                      Text(if (hasOverlay) "✓ Overlay Granted" else "Grant Overlay Permission")
                                  }

                                  Button(onClick = {
                                      ctx.startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                                  }, modifier = Modifier.fillMaxWidth()) {
                                      Text("Grant Notification Access")
                                  }

                                  HorizontalDivider()

                                  Button(onClick = {
                                      val i = Intent(ctx, LockScreenService::class.java)
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i) else ctx.startService(i)
                                  }, modifier = Modifier.fillMaxWidth()) { Text("Start Lock Screen Service") }

                                  Button(onClick = {
                                      ctx.stopService(Intent(ctx, LockScreenService::class.java))
                                  }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.error)) {
                                      Text("Stop Service")
                                  }

                                  Button(onClick = {
                                      ctx.startActivity(Intent(ctx, SettingsActivity::class.java))
                                  }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.secondary)) {
                                      Text("Settings")
                                  }

                                  Button(onClick = {
                                      ctx.startActivity(Intent(ctx, LockActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                                  }, modifier = Modifier.fillMaxWidth()) { Text("Preview Lock Screen") }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/odometer/lock/SettingsActivity.kt << 'EOF'
          package com.odometer.lock

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          class SettingsActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      var maxVal by remember { mutableFloatStateOf(Prefs.maxValue.toFloat()) }
                      var vib by remember { mutableStateOf(Prefs.vibrationEnabled) }
                      var snd by remember { mutableStateOf(Prefs.soundEnabled) }
                      var cnt by remember { mutableStateOf(Prefs.showContent) }

                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              Column(modifier = Modifier.padding(24.dp), verticalArrangement = Arrangement.spacedBy(16.dp)) {
                                  Text("Settings", style = MaterialTheme.typography.headlineMedium)
                                  Text("Max Odometer: ${maxVal.toInt()}")
                                  Slider(value = maxVal, onValueChange = { maxVal = it; Prefs.maxValue = it.toInt() }, valueRange = 10f..9999f)

                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Text("Vibration", modifier = Modifier.weight(1f))
                                      Switch(checked = vib, onCheckedChange = { vib = it; Prefs.vibrationEnabled = it })
                                  }
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Text("Sound", modifier = Modifier.weight(1f))
                                      Switch(checked = snd, onCheckedChange = { snd = it; Prefs.soundEnabled = it })
                                  }
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Text("Show Notification Content", modifier = Modifier.weight(1f))
                                      Switch(checked = cnt, onCheckedChange = { cnt = it; Prefs.showContent = it })
                                  }
                                  Button(onClick = { Prefs.odometerValue = 0 }, modifier = Modifier.fillMaxWidth()) {
                                      Text("Reset Odometer to 0")
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/odometer/lock/LockActivity.kt << 'EOF'
          package com.odometer.lock

          import android.app.KeyguardManager
          import android.content.*
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.net.Uri
          import android.os.*
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectVerticalDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.clipToBounds
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.floor
          import kotlin.math.max
          import kotlin.math.pow

          class LockActivity : ComponentActivity() {
              private var tone: ToneGenerator? = null
              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { finishAndRemoveTask() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true) }
                  else {
                      @Suppress("DEPRECATION")
                      window.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON)
                  }
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) { override fun handleOnBackPressed() {} })
                  val filter = IntentFilter().apply { addAction(Intent.ACTION_USER_PRESENT); addAction(Intent.ACTION_SCREEN_OFF) }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(receiver, filter)

                  tone = try { ToneGenerator(AudioManager.STREAM_SYSTEM, 50) } catch (e: Exception) { null }

                  setContent {
                      LockScreenContent(
                          onUnlock = { unlockPhone() },
                          onFeedback = {
                              if (Prefs.vibrationEnabled) {
                                  val v = getSystemService(Vibrator::class.java)
                                  if (Build.VERSION.SDK_INT >= 26) v?.vibrate(VibrationEffect.createOneShot(15, VibrationEffect.DEFAULT_AMPLITUDE))
                                  else @Suppress("DEPRECATION") v?.vibrate(15)
                              }
                              if (Prefs.soundEnabled) tone?.startTone(ToneGenerator.TONE_PROP_BEEP, 20)
                          }
                      )
                  }
              }

              private fun unlockPhone() {
                  val km = getSystemService(KeyguardManager::class.java)
                  if (km == null) { finishAndRemoveTask(); return }
                  km.requestDismissKeyguard(this, object : KeyguardManager.KeyguardDismissCallback() {
                      override fun onDismissSucceeded() { finishAndRemoveTask() }
                  })
              }

              override fun onDestroy() {
                  try { unregisterReceiver(receiver) } catch (e: Exception) {}
                  tone?.release()
                  super.onDestroy()
              }
          }

          @Composable
          fun LockScreenContent(onUnlock: () -> Unit, onFeedback: () -> Unit) {
              val ctx = LocalContext.current
              val notifs by NotificationStore.list.collectAsState()
              var hideNotifs by remember { mutableStateOf(false) }
              var odoVal by remember { mutableIntStateOf(Prefs.odometerValue) }
              val maxVal = remember { Prefs.maxValue }
              var timeStr by remember { mutableStateOf("") }
              var dateStr by remember { mutableStateOf("") }

              LaunchedEffect(Unit) {
                  while (true) {
                      val cal = Calendar.getInstance()
                      timeStr = SimpleDateFormat("HH:mm", Locale.getDefault()).format(cal.time)
                      dateStr = SimpleDateFormat("EEEE, d MMMM", Locale.getDefault()).format(cal.time)
                      delay(1000)
                  }
              }

              LaunchedEffect(odoVal) {
                  if (odoVal >= maxVal) { delay(300); onUnlock() }
              }

              Box(modifier = Modifier.fillMaxSize().background(Color(0xFF0D0D0D))) {
                  Column(modifier = Modifier.fillMaxSize().padding(20.dp)) {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                          IconButton(onClick = { hideNotifs = !hideNotifs }) {
                              Icon(if (hideNotifs) Icons.Default.VisibilityOff else Icons.Default.Visibility, "Toggle", tint = Color(0xFFFF6B35))
                          }
                      }
                      Column(modifier = Modifier.fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(timeStr, fontSize = 84.sp, fontWeight = FontWeight.Thin, color = Color.White)
                          Text(dateStr, fontSize = 16.sp, color = Color(0xFFAAAAAA))
                      }
                      Spacer(Modifier.height(16.dp))

                      LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth()) {
                          if (!hideNotifs) {
                              items(notifs) { n ->
                                  Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp), colors = CardDefaults.cardColors(containerColor = Color(0x1FFFFFFF))) {
                                      Column(modifier = Modifier.padding(12.dp)) {
                                          Text(n.appName, color = Color(0xFFFF6B35), fontSize = 11.sp)
                                          Text(n.title, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                                          if (Prefs.showContent && n.text.isNotEmpty()) Text(n.text, color = Color(0xFFAAAAAA), fontSize = 12.sp)
                                      }
                                  }
                              }
                          }
                      }

                      Column(modifier = Modifier.fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("ODOMETER", color = Color(0xFF888888), fontSize = 12.sp, letterSpacing = 3.sp)
                          Spacer(Modifier.height(8.dp))
                          OdometerDisplay(odoVal, maxVal, onChange = { odoVal = it; Prefs.odometerValue = it; onFeedback() })
                          Text("Swipe up/down to rotate", color = Color(0xFF666666), fontSize = 11.sp, modifier = Modifier.padding(top = 4.dp))
                      }

                      Spacer(Modifier.height(16.dp))
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(modifier = Modifier.size(56.dp).clip(CircleShape).background(Color(0x22FF6B35)).clickable { onUnlock() }, contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Fingerprint, "Unlock", tint = Color(0xFFFF6B35), modifier = Modifier.size(32.dp))
                              }
                              Text("Fingerprint / PIN", color = Color(0xFFAAAAAA), fontSize = 11.sp)
                          }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(modifier = Modifier.size(56.dp).clip(CircleShape).background(Color(0x22FF4444)).clickable {
                                  ctx.startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:112")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              }, contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Phone, "SOS", tint = Color(0xFFFF4444), modifier = Modifier.size(28.dp))
                              }
                              Text("Emergency", color = Color(0xFFAAAAAA), fontSize = 11.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun OdometerDisplay(value: Int, maxVal: Int, onChange: (Int) -> Unit) {
              val animVal by animateFloatAsState(targetValue = value.toFloat(), label = "odo")
              var dragAccum by remember { mutableFloatStateOf(0f) }

              Row(
                  modifier = Modifier
                      .clip(RoundedCornerShape(12.dp))
                      .background(Color(0xFF161616))
                      .padding(horizontal = 14.dp, vertical = 8.dp)
                      .pointerInput(value, maxVal) {
                          detectVerticalDragGestures { change, dragAmount ->
                              change.consume()
                              dragAccum -= dragAmount
                              if (dragAccum >= 60f) { onChange((value + 1).coerceIn(0, maxVal)); dragAccum = 0f }
                              else if (dragAccum <= -60f) { onChange((value - 1).coerceIn(0, maxVal)); dragAccum = 0f }
                          }
                      },
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  for (p in 3 downTo 0) {
                      val place = 10.0.pow(p).toFloat()
                      val digit = (floor(animVal / place).toInt()) % 10
                      Box(modifier = Modifier.height(60.dp).width(36.dp).clipToBounds(), contentAlignment = Alignment.Center) {
                          Text("$digit", fontSize = 46.sp, fontWeight = FontWeight.Bold, color = Color(0xFFF5F5F5))
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: odometer-lock-apk
          path: app/build/outputs/apk/debug/*.apk
