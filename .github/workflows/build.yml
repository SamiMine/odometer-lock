          EOF

          cat > app/src/main/java/com/odometer/lock/LockActivity.kt << 'EOF'
          package com.odometer.lock

          import android.app.KeyguardManager
          import android.content.*
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.media.*
          import android.net.Uri
          import android.os.*
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.drawIntoCanvas
          import androidx.compose.ui.graphics.nativeCanvas
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.*

          class LockActivity : ComponentActivity() {
              private var soundPool: SoundPool? = null
              private var engineStreamId = 0
              private var engineSoundId = 0
              private var exhaustPopId = 0

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { finishAndRemoveTask() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true) }
                  else {
                      @Suppress("DEPRECATION")
                      window.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON)
                  }
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) { override fun handleOnBackPressed() {} })
                  val filter = IntentFilter().apply { addAction(Intent.ACTION_USER_PRESENT); addAction(Intent.ACTION_SCREEN_OFF) }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(receiver, filter)

                  initRealSupercarAudio()

                  setContent {
                      OppoAventadorLockScreen(
                          onUnlock = { unlockPhone() },
                          onRevEngine = { ratio -> updateRealEngineSound(ratio) },
                          onRelease = { stopRealEngineSound() }
                      )
                  }
              }

              private fun initRealSupercarAudio() {
                  val attrs = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_GAME)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                      .build()
                  soundPool = SoundPool.Builder().setMaxStreams(4).setAudioAttributes(attrs).build()

                  val revResId = resources.getIdentifier("engine_rev", "raw", packageName)
                  val popResId = resources.getIdentifier("exhaust_pop", "raw", packageName)
                  if (revResId != 0) engineSoundId = soundPool?.load(this, revResId, 1) ?: 0
                  if (popResId != 0) exhaustPopId = soundPool?.load(this, popResId, 1) ?: 0
              }

              private fun updateRealEngineSound(ratio: Float) {
                  if (!Prefs.sound || engineSoundId == 0) return
                  val targetPitch = 0.75f + (ratio * 1.35f) // Smooth pitch shift 0.75x to 2.1x
                  val targetVol = (0.3f + ratio * 0.7f).coerceIn(0.1f, 1.0f)

                  if (engineStreamId == 0) {
                      engineStreamId = soundPool?.play(engineSoundId, targetVol, targetVol, 1, -1, targetPitch) ?: 0
                  } else {
                      soundPool?.setRate(engineStreamId, targetPitch)
                      soundPool?.setVolume(engineStreamId, targetVol, targetVol)
                  }

                  if (Prefs.vibration && ratio > 0.1f) {
                      val v = getSystemService(Vibrator::class.java)
                      val amp = (ratio * 255).toInt().coerceIn(15, 255)
                      if (Build.VERSION.SDK_INT >= 26) v?.vibrate(VibrationEffect.createOneShot(20, amp))
                  }
              }

              private fun stopRealEngineSound() {
                  if (engineStreamId != 0) {
                      soundPool?.stop(engineStreamId)
                      engineStreamId = 0
                  }
              }

              private fun unlockPhone() {
                  stopRealEngineSound()
                  if (exhaustPopId != 0 && Prefs.sound) {
                      soundPool?.play(exhaustPopId, 1.0f, 1.0f, 2, 0, 1.0f)
                  }
                  val km = getSystemService(KeyguardManager::class.java)
                  if (km == null) { finishAndRemoveTask(); return }
                  km.requestDismissKeyguard(this, object : KeyguardManager.KeyguardDismissCallback() {
                      override fun onDismissSucceeded() { finishAndRemoveTask() }
                  })
              }

              override fun onDestroy() {
                  stopRealEngineSound()
                  try { unregisterReceiver(receiver) } catch (e: Exception) {}
                  soundPool?.release()
                  super.onDestroy()
              }
          }

          @Composable
          fun OppoAventadorLockScreen(onUnlock: () -> Unit, onRevEngine: (Float) -> Unit, onRelease: () -> Unit) {
              val ctx = LocalContext.current
              val notifs by NotificationStore.list.collectAsState()
              var hideNotifs by remember { mutableStateOf(false) }
              var needleRatio by remember { mutableFloatStateOf(0f) }
              var timeStr by remember { mutableStateOf("") }
              var dateStr by remember { mutableStateOf("") }

              LaunchedEffect(Unit) {
                  while (true) {
                      val cal = Calendar.getInstance()
                      timeStr = SimpleDateFormat("HH:mm", Locale.getDefault()).format(cal.time)
                      dateStr = SimpleDateFormat("EEEE, d MMMM", Locale.getDefault()).format(cal.time)
                      delay(1000)
                  }
              }

              LaunchedEffect(needleRatio) {
                  if (needleRatio >= 0.98f) {
                      delay(100)
                      onUnlock()
                  }
              }

              Box(modifier = Modifier.fillMaxSize().background(Color(0xFF040507))) {
                  Column(modifier = Modifier.fillMaxSize().padding(14.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                          IconButton(onClick = { hideNotifs = !hideNotifs }) {
                              Icon(if (hideNotifs) Icons.Default.VisibilityOff else Icons.Default.Visibility, "Toggle", tint = Color(0xFFFF5722))
                          }
                      }

                      Text(timeStr, fontSize = 70.sp, fontWeight = FontWeight.Thin, color = Color.White)
                      Text(dateStr, fontSize = 13.sp, color = Color(0xFFB0BEC5), letterSpacing = 2.sp)
                      Spacer(Modifier.height(4.dp))

                      if (!hideNotifs && notifs.isNotEmpty()) {
                          LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth()) {
                              items(notifs) { n ->
                                  Card(modifier = Modifier.fillMaxWidth().padding(vertical = 2.dp), colors = CardDefaults.cardColors(containerColor = Color(0x1AFFFFFF))) {
                                      Column(modifier = Modifier.padding(8.dp)) {
                                          Text(n.appName, color = Color(0xFFFF5722), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                                          Text(n.title, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Medium)
                                      }
                                  }
                              }
                          }
                      } else {
                          Spacer(modifier = Modifier.weight(1f))
                      }

                      // The Authentic Oppo Find 5 Skeuomorphic Gauge
                      AventadorClusterGauge(
                          ratio = needleRatio,
                          onRatioChange = { r ->
                              needleRatio = r
                              if (r > 0f) onRevEngine(r) else onRelease()
                          },
                          onRelease = {
                              needleRatio = 0f
                              onRelease()
                          }
                      )

                      Spacer(Modifier.height(14.dp))

                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(modifier = Modifier.size(52.dp).clip(CircleShape).background(Color(0x22FF5722)).clickable { onUnlock() }, contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Fingerprint, "Fingerprint", tint = Color(0xFFFF5722), modifier = Modifier.size(30.dp))
                              }
                              Text("Bypass / PIN", color = Color(0xFF90A4AE), fontSize = 11.sp)
                          }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(modifier = Modifier.size(52.dp).clip(CircleShape).background(Color(0x22D50000)).clickable {
                                  ctx.startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:112")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              }, contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Phone, "Emergency", tint = Color(0xFFFF1744), modifier = Modifier.size(26.dp))
                              }
                              Text("Emergency", color = Color(0xFF90A4AE), fontSize = 11.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun AventadorClusterGauge(ratio: Float, onRatioChange: (Float) -> Unit, onRelease: () -> Unit) {
              val smoothRatio by animateFloatAsState(targetValue = ratio, label = "gauge")

              Box(
                  modifier = Modifier
                      .size(300.dp)
                      .pointerInput(Unit) {
                          detectDragGestures(
                              onDrag = { change, _ ->
                                  change.consume()
                                  val center = Offset(size.width / 2f, size.height / 2f)
                                  val touch = change.position
                                  val angleRad = atan2(touch.y - center.y, touch.x - center.x)
                                  var angleDeg = Math.toDegrees(angleRad.toDouble()).toFloat()
                                  if (angleDeg < 0) angleDeg += 360f

                                  // Exactly 270 degree sweep from 135 deg to 405 deg (7:30 to 4:30)
                                  val startAngle = 135f
                                  val sweepAngle = 270f
                                  var progress = (angleDeg - startAngle) / sweepAngle
                                  if (progress < 0f && angleDeg < 90f) progress = (angleDeg + 360f - startAngle) / sweepAngle
                                  onRatioChange(progress.coerceIn(0f, 1f))
                              },
                              onDragEnd = { onRelease() },
                              onDragCancel = { onRelease() }
                          )
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width
                      val center = Offset(w / 2f, w / 2f)
                      val outerRadius = w / 2f - 10.dp.toPx()

                      // 1. Heavy Brushed Titanium Chrome Rim
                      drawCircle(
                          brush = Brush.sweepGradient(listOf(Color(0xFF455A64), Color(0xFFCFD8DC), Color(0xFF263238), Color(0xFFECEFF1), Color(0xFF37474F))),
                          radius = outerRadius
                      )
                      drawCircle(color = Color(0xFF0A0D12), radius = outerRadius - 8.dp.toPx())

                      // 2. Realistic 3D Carbon Fiber Plate
                      val dialRadius = outerRadius - 10.dp.toPx()
                      drawCircle(color = Color(0xFF13171F), radius = dialRadius)
                      for (i in -dialRadius.toInt()..dialRadius.toInt() step 10) {
                          drawLine(Color(0x18FFFFFF), Offset(center.x - dialRadius, center.y + i), Offset(center.x + dialRadius, center.y + i), strokeWidth = 1.5f)
                          drawLine(Color(0x10000000), Offset(center.x + i, center.y - dialRadius), Offset(center.x + i, center.y + dialRadius), strokeWidth = 1.5f)
                      }

                      // 3. Lamborghini Swept Tachometer Track
                      val startAngle = 135f
                      val sweep = 270f
                      drawArc(
                          color = Color(0xFF1C242E),
                          startAngle = startAngle,
                          sweepAngle = sweep,
                          useCenter = false,
                          style = Stroke(width = 10.dp.toPx(), cap = StrokeCap.Round)
                      )

                      // Glowing Acceleration Arc
                      val activeSweep = sweep * smoothRatio
                      drawArc(
                          brush = Brush.sweepGradient(listOf(Color(0xFFFF9800), Color(0xFFFF5722), Color(0xFFD50000))),
                          startAngle = startAngle,
                          sweepAngle = activeSweep,
                          useCenter = false,
                          style = Stroke(width = 11.dp.toPx(), cap = StrokeCap.Round)
                      )

                      // 4. Detailed RPM Markings (0 to 8 x1000 RPM)
                      for (i in 0..8) {
                          val r = i / 8f
                          val a = Math.toRadians((startAngle + (sweep * r)).toDouble())
                          val outer = Offset(center.x + (dialRadius - 8.dp.toPx()) * cos(a).toFloat(), center.y + (dialRadius - 8.dp.toPx()) * sin(a).toFloat())
                          val inner = Offset(center.x + (dialRadius - 22.dp.toPx()) * cos(a).toFloat(), center.y + (dialRadius - 22.dp.toPx()) * sin(a).toFloat())
                          val isRedline = i >= 7
                          val tickColor = if (isRedline) Color(0xFFFF1744) else Color(0xFFECEFF1)
                          drawLine(tickColor, inner, outer, strokeWidth = 3.dp.toPx(), cap = StrokeCap.Round)

                          val textPos = Offset(center.x + (dialRadius - 38.dp.toPx()) * cos(a).toFloat(), center.y + (dialRadius - 38.dp.toPx()) * sin(a).toFloat() + 5.dp.toPx())
                          drawIntoCanvas { canvas ->
                              val p = Paint().apply {
                                  color = if (isRedline) android.graphics.Color.RED else android.graphics.Color.WHITE
                                  textSize = 28f
                                  textAlign = Paint.Align.CENTER
                                  typeface = Typeface.DEFAULT_BOLD
                              }
                              canvas.nativeCanvas.drawText("$i", textPos.x, textPos.y, p)
                          }
                      }

                      // 5. Authentic Skeuomorphic 3D Needle
                      val needleAngle = Math.toRadians((startAngle + (sweep * smoothRatio)).toDouble())
                      val needleEnd = Offset(center.x + (dialRadius - 12.dp.toPx()) * cos(needleAngle).toFloat(), center.y + (dialRadius - 12.dp.toPx()) * sin(needleAngle).toFloat())

                      // Needle Drop Shadow
                      drawLine(
                          color = Color(0x88000000),
                          start = Offset(center.x + 4.dp.toPx(), center.y + 5.dp.toPx()),
                          end = Offset(needleEnd.x + 4.dp.toPx(), needleEnd.y + 5.dp.toPx()),
                          strokeWidth = 7.dp.toPx(),
                          cap = StrokeCap.Round
                      )
                      // Fluorescent Orange-Red Glowing Needle
                      drawLine(
                          color = if (smoothRatio > 0.8f) Color(0xFFFF1744) else Color(0xFFFF5722),
                          start = center,
                          end = needleEnd,
                          strokeWidth = 5.dp.toPx(),
                          cap = StrokeCap.Round
                      )

                      // Metallic Center Pivot Cap
                      drawCircle(Color(0xFF37474F), radius = 18.dp.toPx())
                      drawCircle(Color(0xFFCFD8DC), radius = 12.dp.toPx())
                      drawCircle(Color(0xFFFF5722), radius = 6.dp.toPx())

                      // 6. Central Supercar Telemetry Display
                      drawIntoCanvas { canvas ->
                          val speed = (smoothRatio * 320).toInt()
                          val p = Paint().apply {
                              color = android.graphics.Color.WHITE
                              textSize = 48f
                              textAlign = Paint.Align.CENTER
                              typeface = Typeface.DEFAULT_BOLD
                          }
                          canvas.nativeCanvas.drawText("$speed", center.x, center.y + 45.dp.toPx(), p)
                          p.textSize = 20f
                          p.color = android.graphics.Color.GRAY
                          canvas.nativeCanvas.drawText("km/h - x1000r/min", center.x, center.y + 64.dp.toPx(), p)
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oppo-find5-supercar-v4
          path: app/build/outputs/apk/debug/*.apk
