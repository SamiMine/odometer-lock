name: Build Odometer Lock

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scaffold Professional Supercar Lock
        run: |
          mkdir -p app/src/main/java/com/odometer/lock
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/raw

          # Real Deep Supercar Roar (No chipmunk pitch)
          curl -L -o app/src/main/res/raw/supercar_idle.mp3 "https://assets.mixkit.co/active_storage/sfx/2813/2813-preview.mp3" || true
          curl -L -o app/src/main/res/raw/supercar_pop.mp3 "https://assets.mixkit.co/active_storage/sfx/1545/1545-preview.mp3" || true

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "OppoFind5Master"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.odometer.lock'
              compileSdk 34
              defaultConfig {
                  applicationId "com.odometer.lock"
                  minSdk 26
                  targetSdk 34
                  versionCode 5
                  versionName "5.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion = '1.5.8' }
          }
          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:name=".LockApp"
                  android:label="OPPO Supercar Lock"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".LockActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleInstance"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true" />
                  <service
                      android:name=".LockScreenService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="lock_screen" />
                  </service>
                  <service
                      android:name=".NotificationService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">OPPO Supercar Lock</string></resources>
          EOF

          cat > app/src/main/java/com/odometer/lock/Core.kt << 'EOF'
          package com.odometer.lock

          import android.app.*
          import android.content.*
          import android.net.Uri
          import android.os.*
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.asStateFlow

          class LockApp : Application() {
              override fun onCreate() { super.onCreate(); Prefs.init(this) }
          }

          object Prefs {
              private lateinit var sp: SharedPreferences
              fun init(c: Context) { sp = c.getSharedPreferences("oppo_master_prefs", Context.MODE_PRIVATE) }
              var sound: Boolean get() = sp.getBoolean("snd", true); set(v) = sp.edit().putBoolean("snd", v).apply()
              var vibration: Boolean get() = sp.getBoolean("vib", true); set(v) = sp.edit().putBoolean("vib", v).apply()
              var customDialUri: String? get() = sp.getString("dial_uri", null); set(v) = sp.edit().putString("dial_uri", v).apply()
              var customNeedleUri: String? get() = sp.getString("needle_uri", null); set(v) = sp.edit().putString("needle_uri", v).apply()
              var customSoundUri: String? get() = sp.getString("sound_uri", null); set(v) = sp.edit().putString("sound_uri", v).apply()
          }

          data class LockNotification(val key: String, val appName: String, val title: String)

          object NotificationStore {
              private val _list = MutableStateFlow<List<LockNotification>>(emptyList())
              val list = _list.asStateFlow()
              fun add(n: LockNotification) {
                  val cur = _list.value.toMutableList()
                  val idx = cur.indexOfFirst { it.key == n.key }
                  if (idx >= 0) cur[idx] = n else cur.add(0, n)
                  _list.value = cur.take(5)
              }
              fun remove(key: String) { _list.value = _list.value.filterNot { it.key == key } }
          }

          class NotificationService : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName || (sbn.notification.flags and Notification.FLAG_ONGOING_EVENT != 0)) return
                  val title = sbn.notification.extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val name = try { packageManager.getApplicationLabel(packageManager.getApplicationInfo(sbn.packageName, 0)).toString() } catch (e: Exception) { sbn.packageName }
                  NotificationStore.add(LockNotification(sbn.key ?: "", name, title))
              }
              override fun onNotificationRemoved(sbn: StatusBarNotification) { NotificationStore.remove(sbn.key ?: "") }
          }

          class LockScreenService : Service() {
              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action == Intent.ACTION_SCREEN_ON) {
                          val km = getSystemService(KeyguardManager::class.java)
                          if (km?.isKeyguardLocked == true) {
                              startActivity(Intent(context, LockActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                              })
                          }
                      }
                  }
              }
              override fun onCreate() {
                  super.onCreate()
                  val chanId = "find5_lock_service"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(
                          NotificationChannel(chanId, "Supercar Service", NotificationManager.IMPORTANCE_MIN)
                      )
                  }
                  startForeground(1, NotificationCompat.Builder(this, chanId)
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setContentTitle("Supercar Dashboard Active").build())
                  val filter = IntentFilter(Intent.ACTION_SCREEN_ON)
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(receiver, filter)
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int) = START_STICKY
              override fun onBind(intent: Intent?) = null
              override fun onDestroy() { try { unregisterReceiver(receiver) } catch (e: Exception) {}; super.onDestroy() }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val i = Intent(context, LockScreenService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(i) else context.startService(i)
              }
          }
          EOF

          cat > app/src/main/java/com/odometer/lock/MainActivity.kt << 'EOF'
          package com.odometer.lock

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val ctx = LocalContext.current
                      var hasOverlay by remember { mutableStateOf(Settings.canDrawOverlays(ctx)) }
                      var dialSet by remember { mutableStateOf(Prefs.customDialUri != null) }
                      var needleSet by remember { mutableStateOf(Prefs.customNeedleUri != null) }
                      var soundSet by remember { mutableStateOf(Prefs.customSoundUri != null) }

                      val dialPicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                          if (uri != null) {
                              try { ctx.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (e: Exception) {}
                              Prefs.customDialUri = uri.toString()
                              dialSet = true
                          }
                      }
                      val needlePicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                          if (uri != null) {
                              try { ctx.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (e: Exception) {}
                              Prefs.customNeedleUri = uri.toString()
                              needleSet = true
                          }
                      }
                      val soundPicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                          if (uri != null) {
                              try { ctx.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (e: Exception) {}
                              Prefs.customSoundUri = uri.toString()
                              soundSet = true
                          }
                      }

                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              Column(modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(24.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                                  Text("OPPO Find 5 Studio", style = MaterialTheme.typography.headlineMedium)
                                  Text("Custom Supercar Dashboard & Sound Control")

                                  Button(onClick = {
                                      ctx.startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:${ctx.packageName}")))
                                  }, modifier = Modifier.fillMaxWidth()) {
                                      Text(if (hasOverlay) "✓ Overlay Granted" else "Grant Overlay Permission")
                                  }

                                  Button(onClick = {
                                      ctx.startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                                  }, modifier = Modifier.fillMaxWidth()) {
                                      Text("Grant Notification Access")
                                  }

                                  HorizontalDivider()

                                  Text("Custom Images & Audio (Optional):", style = MaterialTheme.typography.titleMedium)

                                  Button(onClick = { dialPicker.launch("image/*") }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.secondary)) {
                                      Text(if (dialSet) "✓ Custom Dial Set (Click to change)" else "Select Dial Image (صورة العداد)")
                                  }

                                  Button(onClick = { needlePicker.launch("image/*") }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.secondary)) {
                                      Text(if (needleSet) "✓ Custom Needle Set (Click to change)" else "Select Needle PNG (صورة الإبرة)")
                                  }

                                  Button(onClick = { soundPicker.launch("audio/*") }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.secondary)) {
                                      Text(if (soundSet) "✓ Custom Engine Sound Set" else "Select Engine Audio MP3 (صوت المحرك)")
                                  }

                                  if (dialSet || needleSet || soundSet) {
                                      TextButton(onClick = {
                                          Prefs.customDialUri = null
                                          Prefs.customNeedleUri = null
                                          Prefs.customSoundUri = null
                                          dialSet = false
                                          needleSet = false
                                          soundSet = false
                                      }) { Text("Reset to Default 3D Cockpit") }
                                  }

                                  HorizontalDivider()

                                  Button(onClick = {
                                      val i = Intent(ctx, LockScreenService::class.java)
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i) else ctx.startService(i)
                                  }, modifier = Modifier.fillMaxWidth()) { Text("Start Lock Screen Service") }

                                  Button(onClick = {
                                      ctx.startActivity(Intent(ctx, LockActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                                  }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary)) {
                                      Text("Preview Lock Screen")
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/odometer/lock/LockActivity.kt << 'EOF'
          package com.odometer.lock

          import android.app.KeyguardManager
          import android.content.*
          import android.graphics.BitmapFactory
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.media.*
          import android.net.Uri
          import android.os.*
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.drawIntoCanvas
          import androidx.compose.ui.graphics.drawscope.rotate
          import androidx.compose.ui.graphics.nativeCanvas
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.IntSize
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.*

          class LockActivity : ComponentActivity() {
              private var soundPool: SoundPool? = null
              private var defaultRevId = 0
              private var defaultPopId = 0
              private var streamId = 0
              private var customPlayer: MediaPlayer? = null

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { finishAndRemoveTask() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true) }
                  else {
                      @Suppress("DEPRECATION")
                      window.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON)
                  }
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) { override fun handleOnBackPressed() {} })
                  val filter = IntentFilter().apply { addAction(Intent.ACTION_USER_PRESENT); addAction(Intent.ACTION_SCREEN_OFF) }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(receiver, filter)

                  initSound()

                  setContent {
                      MasterLockScreen(
                          onUnlock = { unlockPhone() },
                          onRev = { r -> handleEngineRev(r) },
                          onRelease = { stopEngineRev() }
                      )
                  }
              }

              private fun initSound() {
                  if (Prefs.customSoundUri != null) {
                      try {
                          customPlayer = MediaPlayer().apply {
                              setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).setUsage(AudioAttributes.USAGE_GAME).build())
                              setDataSource(this@LockActivity, Uri.parse(Prefs.customSoundUri))
                              isLooping = true
                              prepare()
                          }
                      } catch (e: Exception) { customPlayer = null }
                  }

                  val attrs = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_GAME).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build()
                  soundPool = SoundPool.Builder().setMaxStreams(2).setAudioAttributes(attrs).build()
                  val rId = resources.getIdentifier("supercar_idle", "raw", packageName)
                  val pId = resources.getIdentifier("supercar_pop", "raw", packageName)
                  if (rId != 0) defaultRevId = soundPool?.load(this, rId, 1) ?: 0
                  if (pId != 0) defaultPopId = soundPool?.load(this, pId, 1) ?: 0
              }

              private fun handleEngineRev(ratio: Float) {
                  if (!Prefs.sound) return

                  if (customPlayer != null) {
                      try {
                          if (customPlayer?.isPlaying == false) customPlayer?.start()
                          val vol = (0.2f + ratio * 0.8f).coerceIn(0.1f, 1.0f)
                          customPlayer?.setVolume(vol, vol)
                      } catch (e: Exception) {}
                  } else if (defaultRevId != 0) {
                      // REAL BASS REV: Rate stays between 0.9x and 1.15x (NO CHIPMUNK SOUND)
                      val naturalRate = 0.92f + (ratio * 0.22f)
                      val volume = (0.25f + ratio * 0.75f).coerceIn(0.1f, 1.0f)

                      if (streamId == 0) {
                          streamId = soundPool?.play(defaultRevId, volume, volume, 1, -1, naturalRate) ?: 0
                      } else {
                          soundPool?.setRate(streamId, naturalRate)
                          soundPool?.setVolume(streamId, volume, volume)
                      }
                  }

                  if (Prefs.vibration && ratio > 0.12f) {
                      val v = getSystemService(Vibrator::class.java)
                      val intensity = (ratio * 255).toInt().coerceIn(20, 255)
                      if (Build.VERSION.SDK_INT >= 26) v?.vibrate(VibrationEffect.createOneShot(20, intensity))
                  }
              }

              private fun stopEngineRev() {
                  try {
                      if (streamId != 0) { soundPool?.stop(streamId); streamId = 0 }
                      if (customPlayer?.isPlaying == true) { customPlayer?.pause(); customPlayer?.seekTo(0) }
                  } catch (e: Exception) {}
              }

              private fun unlockPhone() {
                  stopEngineRev()
                  if (defaultPopId != 0 && Prefs.sound) {
                      soundPool?.play(defaultPopId, 1.0f, 1.0f, 2, 0, 1.0f)
                  }
                  val km = getSystemService(KeyguardManager::class.java)
                  if (km == null) { finishAndRemoveTask(); return }
                  km.requestDismissKeyguard(this, object : KeyguardManager.KeyguardDismissCallback() {
                      override fun onDismissSucceeded() { finishAndRemoveTask() }
                  })
              }

              override fun onDestroy() {
                  stopEngineRev()
                  try { unregisterReceiver(receiver) } catch (e: Exception) {}
                  soundPool?.release()
                  customPlayer?.release()
                  super.onDestroy()
              }
          }

          @Composable
          fun MasterLockScreen(onUnlock: () -> Unit, onRev: (Float) -> Unit, onRelease: () -> Unit) {
              val ctx = LocalContext.current
              val notifs by NotificationStore.list.collectAsState()
              var hideNotifs by remember { mutableStateOf(false) }
              var ratio by remember { mutableFloatStateOf(0f) }
              var timeStr by remember { mutableStateOf("") }
              var dateStr by remember { mutableStateOf("") }

              val customDialBitmap = remember {
                  Prefs.customDialUri?.let { uriStr ->
                      try {
                          ctx.contentResolver.openInputStream(Uri.parse(uriStr))?.use { BitmapFactory.decodeStream(it)?.asImageBitmap() }
                      } catch (e: Exception) { null }
                  }
              }
              val customNeedleBitmap = remember {
                  Prefs.customNeedleUri?.let { uriStr ->
                      try {
                          ctx.contentResolver.openInputStream(Uri.parse(uriStr))?.use { BitmapFactory.decodeStream(it)?.asImageBitmap() }
                      } catch (e: Exception) { null }
                  }
              }

              LaunchedEffect(Unit) {
                  while (true) {
                      val cal = Calendar.getInstance()
                      timeStr = SimpleDateFormat("HH:mm", Locale.getDefault()).format(cal.time)
                      dateStr = SimpleDateFormat("EEEE, d MMMM", Locale.getDefault()).format(cal.time)
                      delay(1000)
                  }
              }

              LaunchedEffect(ratio) {
                  if (ratio >= 0.98f) {
                      delay(80)
                      onUnlock()
                  }
              }

              Box(modifier = Modifier.fillMaxSize().background(Color(0xFF030406))) {
                  Column(modifier = Modifier.fillMaxSize().padding(14.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                          IconButton(onClick = { hideNotifs = !hideNotifs }) {
                              Icon(if (hideNotifs) Icons.Default.VisibilityOff else Icons.Default.Visibility, "Toggle", tint = Color(0xFFFF5722))
                          }
                      }

                      Text(timeStr, fontSize = 72.sp, fontWeight = FontWeight.Thin, color = Color.White)
                      Text(dateStr, fontSize = 13.sp, color = Color(0xFFB0BEC5), letterSpacing = 2.sp)
                      Spacer(Modifier.height(6.dp))

                      if (!hideNotifs && notifs.isNotEmpty()) {
                          LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth()) {
                              items(notifs) { n ->
                                  Card(modifier = Modifier.fillMaxWidth().padding(vertical = 2.dp), colors = CardDefaults.cardColors(containerColor = Color(0x1AFFFFFF))) {
                                      Column(modifier = Modifier.padding(8.dp)) {
                                          Text(n.appName, color = Color(0xFFFF5722), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                                          Text(n.title, color = Color.White, fontSize = 12.sp)
                                      }
                                  }
                              }
                          }
                      } else {
                          Spacer(modifier = Modifier.weight(1f))
                      }

                      // Dynamic Supercar Cluster
                      InteractiveCluster(
                          ratio = ratio,
                          dialImage = customDialBitmap,
                          needleImage = customNeedleBitmap,
                          onRatioChange = { r ->
                              ratio = r
                              if (r > 0f) onRev(r) else onRelease()
                          },
                          onRelease = {
                              ratio = 0f
                              onRelease()
                          }
                      )

                      Spacer(Modifier.height(14.dp))

                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(modifier = Modifier.size(52.dp).clip(CircleShape).background(Color(0x22FF5722)).clickable { onUnlock() }, contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Fingerprint, "Fingerprint", tint = Color(0xFFFF5722), modifier = Modifier.size(30.dp))
                              }
                              Text("Bypass / PIN", color = Color(0xFF90A4AE), fontSize = 11.sp)
                          }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(modifier = Modifier.size(52.dp).clip(CircleShape).background(Color(0x22D50000)).clickable {
                                  ctx.startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:112")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              }, contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Phone, "SOS", tint = Color(0xFFFF1744), modifier = Modifier.size(26.dp))
                              }
                              Text("Emergency", color = Color(0xFF90A4AE), fontSize = 11.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun InteractiveCluster(
              ratio: Float,
              dialImage: ImageBitmap?,
              needleImage: ImageBitmap?,
              onRatioChange: (Float) -> Unit,
              onRelease: () -> Unit
          ) {
              val smoothRatio by animateFloatAsState(targetValue = ratio, label = "gauge")

              Box(
                  modifier = Modifier
                      .size(310.dp)
                      .pointerInput(Unit) {
                          detectDragGestures(
                              onDrag = { change, _ ->
                                  change.consume()
                                  val center = Offset(size.width / 2f, size.height / 2f)
                                  val touch = change.position
                                  val angleRad = atan2(touch.y - center.y, touch.x - center.x)
                                  var angleDeg = Math.toDegrees(angleRad.toDouble()).toFloat()
                                  if (angleDeg < 0) angleDeg += 360f

                                  // 135 deg to 405 deg (270 degrees sweep)
                                  val startAngle = 135f
                                  val sweepAngle = 270f
                                  var progress = (angleDeg - startAngle) / sweepAngle
                                  if (progress < 0f && angleDeg < 90f) progress = (angleDeg + 360f - startAngle) / sweepAngle
                                  onRatioChange(progress.coerceIn(0f, 1f))
                              },
                              onDragEnd = { onRelease() },
                              onDragCancel = { onRelease() }
                          )
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width
                      val center = Offset(w / 2f, w / 2f)

                      if (dialImage != null) {
                          // Draw User's Custom Photorealistic Dial
                          drawImage(
                              image = dialImage,
                              dstOffset = IntOffset.Zero,
                              dstSize = IntSize(w.toInt(), w.toInt())
                          )
                      } else {
                          // Default High-End 3D Rendered Cockpit Bezel
                          val outerR = w / 2f - 8.dp.toPx()
                          drawCircle(
                              brush = Brush.sweepGradient(listOf(Color(0xFF37474F), Color(0xFFECEFF1), Color(0xFF263238), Color(0xFFCFD8DC), Color(0xFF37474F))),
                              radius = outerR
                          )
                          drawCircle(color = Color(0xFF0C0F14), radius = outerR - 8.dp.toPx())

                          val dialR = outerR - 10.dp.toPx()
                          drawCircle(color = Color(0xFF131720), radius = dialR)

                          // Carbon Fiber Mesh
                          for (i in -dialR.toInt()..dialR.toInt() step 8) {
                              drawLine(Color(0x15FFFFFF), Offset(center.x - dialR, center.y + i), Offset(center.x + dialR, center.y + i), strokeWidth = 1f)
                          }

                          val startAngle = 135f
                          val sweep = 270f
                          drawArc(color = Color(0xFF1E2836), startAngle = startAngle, sweepAngle = sweep, useCenter = false, style = Stroke(12.dp.toPx(), cap = StrokeCap.Round))
                          drawArc(
                              brush = Brush.sweepGradient(listOf(Color(0xFFFF9800), Color(0xFFFF5722), Color(0xFFD50000))),
                              startAngle = startAngle,
                              sweepAngle = sweep * smoothRatio,
                              useCenter = false,
                              style = Stroke(13.dp.toPx(), cap = StrokeCap.Round)
                          )

                          for (i in 0..8) {
                              val a = Math.toRadians((startAngle + (sweep * (i / 8f))).toDouble())
                              val outer = Offset(center.x + (dialR - 8.dp.toPx()) * cos(a).toFloat(), center.y + (dialR - 8.dp.toPx()) * sin(a).toFloat())
                              val inner = Offset(center.x + (dialR - 22.dp.toPx()) * cos(a).toFloat(), center.y + (dialR - 22.dp.toPx()) * sin(a).toFloat())
                              drawLine(if (i >= 7) Color(0xFFFF1744) else Color(0xFFECEFF1), inner, outer, strokeWidth = 3.dp.toPx(), cap = StrokeCap.Round)

                              val textPos = Offset(center.x + (dialR - 38.dp.toPx()) * cos(a).toFloat(), center.y + (dialR - 38.dp.toPx()) * sin(a).toFloat() + 5.dp.toPx())
                              drawIntoCanvas { canvas ->
                                  val p = Paint().apply {
                                      color = if (i >= 7) android.graphics.Color.RED else android.graphics.Color.WHITE
                                      textSize = 28f
                                      textAlign = Paint.Align.CENTER
                                      typeface = Typeface.DEFAULT_BOLD
                                  }
                                  canvas.nativeCanvas.drawText("$i", textPos.x, textPos.y, p)
                              }
                          }
                      }

                      // NEEDLE DRAWING
                      val currentAngle = 135f + (270f * smoothRatio)

                      if (needleImage != null) {
                          // Draw User's Custom 3D Needle
                          rotate(degrees = currentAngle + 90f, pivot = center) {
                              val needleW = (w * 0.12f).toInt()
                              val needleH = (w * 0.45f).toInt()
                              drawImage(
                                  image = needleImage,
                                  dstOffset = IntOffset((center.x - needleW / 2).toInt(), (center.y - needleH).toInt()),
                                  dstSize = IntSize(needleW, needleH)
                              )
                          }
                      } else {
                          // 3D Fluorescent Glowing Needle
                          val needleAngleRad = Math.toRadians(currentAngle.toDouble())
                          val needleLen = (w / 2f) - 24.dp.toPx()
                          val needleEnd = Offset(center.x + needleLen * cos(needleAngleRad).toFloat(), center.y + needleLen * sin(needleAngleRad).toFloat())

                          // Shadow
                          drawLine(Color(0x77000000), Offset(center.x + 3.dp.toPx(), center.y + 4.dp.toPx()), Offset(needleEnd.x + 3.dp.toPx(), needleEnd.y + 4.dp.toPx()), strokeWidth = 6.dp.toPx(), cap = StrokeCap.Round)
                          // Glowing Shaft
                          drawLine(if (smoothRatio > 0.8f) Color(0xFFFF1744) else Color(0xFFFF5722), center, needleEnd, strokeWidth = 5.dp.toPx(), cap = StrokeCap.Round)

                          // Metallic Cap
                          drawCircle(Color(0xFF37474F), radius = 18.dp.toPx())
                          drawCircle(Color(0xFFCFD8DC), radius = 10.dp.toPx())
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oppo-find5-master-v5
          path: app/build/outputs/apk/debug/*.apk
