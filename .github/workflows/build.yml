          package com.odometer.lock.ui

          import androidx.compose.animation.core.LinearEasing
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.background
          import androidx.compose.foundation.gestures.detectVerticalDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.clipToBounds
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlin.math.floor
          import kotlin.math.max
          import kotlin.math.pow

          @Composable
          fun OdometerSection(
              value: Int,
              maxValue: Int,
              onValueChange: (Int) -> Unit,
              onStep: () -> Unit,
              digitCount: Int = 5,
              modifier: Modifier = Modifier
          ) {
              val animatedValue by animateFloatAsState(
                  targetValue = value.toFloat(),
                  animationSpec = tween(250, easing = LinearEasing),
                  label = "odometerAnim"
              )

              val density = LocalDensity.current
              val threshold = with(density) { 40.dp.toPx() }
              var accum by remember { mutableFloatStateOf(0f) }

              Box(
                  modifier = modifier
                      .fillMaxWidth()
                      .pointerInput(value, maxValue) {
                          detectVerticalDragGestures(
                              onDrag = { change, dragAmount ->
                                  change.consume()
                                  accum -= dragAmount
                                  while (accum >= threshold) {
                                      onValueChange((value + 1).coerceIn(0, maxValue))
                                      onStep(); accum -= threshold
                                  }
                                  while (accum <= -threshold) {
                                      onValueChange((value - 1).coerceIn(0, maxValue))
                                      onStep(); accum += threshold
                                  }
                              },
                              onDragEnd = { accum = 0f }
                          )
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Row(
                      modifier = Modifier
                          .clip(RoundedCornerShape(16.dp))
                          .background(Color(0xFF0F0F0F))
                          .padding(horizontal = 16.dp, vertical = 10.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      for (p in (digitCount - 1) downTo 0) {
                          val position = computePosition(animatedValue, p)
                          val base = floor(position).toInt() % 10
                          val frac = position - floor(position)
                          RollingDigit(base, frac)
                          if (p == 1) {
                              Text(
                                  text = ",",
                                  color = Color(0xFFFF6B35),
                                  fontSize = 56.sp,
                                  fontWeight = FontWeight.Bold,
                                  modifier = Modifier.padding(horizontal = 2.dp)
                              )
                          }
                      }
                  }
              }
          }

          private fun computePosition(value: Float, place: Int): Float {
              if (place == 0) return value % 10f
              val placeValue = 10.0.pow(place).toFloat()
              val base = floor(value / placeValue)
              val within = value - base * placeValue
              val roll = max(0f, within - (placeValue - 1f))
              return base + roll
          }

          @Composable
          private fun RollingDigit(base: Int, frac: Float) {
              val digitHeight = 72.dp
              Box(
                  modifier = Modifier
                      .height(digitHeight)
                      .width(42.dp)
                      .clipToBounds()
              ) {
                  Column(modifier = Modifier.offset(y = (frac * -72f).dp)) {
                      Box(Modifier.height(digitHeight).fillMaxWidth(), Alignment.Center) {
                          Text(
                              "" + base,
                              fontSize = 56.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color(0xFFF5F5F5)
                          )
                      }
                      Box(Modifier.height(digitHeight).fillMaxWidth(), Alignment.Center) {
                          Text(
                              "" + ((base + 1) % 10),
                              fontSize = 56.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color(0xFFF5F5F5)
                          )
                      }
                  }
              }
          }
