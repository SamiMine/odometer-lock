          cat > app/src/main/java/com/odometer/lock/NotificationService.kt << '__F09__'
          package com.odometer.lock

          import android.app.Notification
          import android.content.pm.PackageManager
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotificationService : NotificationListenerService() {
              override fun onListenerConnected() {
                  super.onListenerConnected()
                  activeNotifications?.forEach { it.pushToStore() }
              }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName) return
                  if (sbn.notification.flags and Notification.FLAG_ONGOING_EVENT != 0) return
                  sbn.pushToStore()
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification) {
                  NotificationStore.remove(sbn.key ?: "")
              }

              private fun StatusBarNotification.pushToStore() {
                  val extras = notification.extras
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val appName = try {
                      val ai = packageManager.getApplicationInfo(packageName, 0)
                      packageManager.getApplicationLabel(ai).toString()
                  } catch (e: PackageManager.NameNotFoundException) { packageName }

                  NotificationStore.addOrUpdate(
                      LockNotification(
                          key = key ?: "",
                          packageName = packageName,
                          appName = appName,
                          title = title,
                          text = text,
                          postedTime = postTime
                      )
                  )
              }
          }
