          cat > app/src/main/java/com/odometer/lock/Prefs.kt << '__F07__'
          package com.odometer.lock

          import android.content.Context
          import android.content.SharedPreferences

          object Prefs {
              private lateinit var sp: SharedPreferences

              fun init(context: Context) {
                  if (!::sp.isInitialized) {
                      sp = context.applicationContext
                          .getSharedPreferences("odometer_lock_prefs", Context.MODE_PRIVATE)
                  }
              }

              var odometerValue: Int
                  get() = sp.getInt("odometer_value", 0)
                  set(v) { sp.edit().putInt("odometer_value", v).apply() }

              var maxValue: Int
                  get() = sp.getInt("max_value", 9999)
                  set(v) { sp.edit().putInt("max_value", v).apply() }

              var vibrationEnabled: Boolean
                  get() = sp.getBoolean("vibration", true)
                  set(v) { sp.edit().putBoolean("vibration", v).apply() }

              var soundEnabled: Boolean
                  get() = sp.getBoolean("sound", true)
                  set(v) { sp.edit().putBoolean("sound", v).apply() }

              var showNotificationContent: Boolean
                  get() = sp.getBoolean("show_notification_content", true)
                  set(v) { sp.edit().putBoolean("show_notification_content", v).apply() }

              var lockEnabled: Boolean
                  get() = sp.getBoolean("lock_enabled", true)
                  set(v) { sp.edit().putBoolean("lock_enabled", v).apply() }

              fun resetOdometer() {
                  odometerValue = 0
              }
          }
