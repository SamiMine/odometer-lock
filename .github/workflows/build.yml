          EOF

          cat > app/src/main/java/com/odometer/lock/LockActivity.kt << 'EOF'
          package com.odometer.lock

          import android.app.KeyguardManager
          import android.content.*
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.media.*
          import android.net.Uri
          import android.os.*
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.drawIntoCanvas
          import androidx.compose.ui.graphics.nativeCanvas
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.*
          import kotlin.random.Random

          class LockActivity : ComponentActivity() {
              private var audioTrack: AudioTrack? = null
              private var audioThread: Thread? = null
              private var isRunningAudio = false
              @Volatile private var targetRevRatio = 0f

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { finishAndRemoveTask() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true) }
                  else {
                      @Suppress("DEPRECATION")
                      window.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON)
                  }
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) { override fun handleOnBackPressed() {} })
                  val filter = IntentFilter().apply { addAction(Intent.ACTION_USER_PRESENT); addAction(Intent.ACTION_SCREEN_OFF) }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(receiver, filter)

                  startEngineAudioLoop()

                  setContent {
                      SupercarDashboard(
                          onUnlock = { unlockPhone() },
                          onRev = { r ->
                              targetRevRatio = r
                              hapticPulse(r)
                          },
                          onRelease = { targetRevRatio = 0f }
                      )
                  }
              }

              private fun startEngineAudioLoop() {
                  val sampleRate = 22050
                  val bufSize = AudioTrack.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  audioTrack = AudioTrack.Builder()
                      .setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).setUsage(AudioAttributes.USAGE_GAME).build())
                      .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sampleRate).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                      .setBufferSizeInBytes(bufSize * 2)
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()

                  audioTrack?.play()
                  isRunningAudio = true

                  audioThread = Thread {
                      val buffer = ShortArray(1024)
                      var phase1 = 0.0
                      var phase2 = 0.0
                      var currentRatioSmooth = 0.0

                      while (isRunningAudio) {
                          currentRatioSmooth += (targetRevRatio - currentRatioSmooth) * 0.15

                          if (currentRatioSmooth < 0.02) {
                              buffer.fill(0)
                              audioTrack?.write(buffer, 0, buffer.size)
                              continue
                          }

                          // Low-frequency throaty V8 rumble (50Hz idle to 160Hz high rev)
                          val baseFreq = 48.0 + (currentRatioSmooth * 125.0)
                          val volume = (0.2 + currentRatioSmooth * 0.75).coerceIn(0.0, 1.0)

                          for (i in buffer.indices) {
                              phase1 += 2.0 * Math.PI * baseFreq / sampleRate
                              phase2 += 2.0 * Math.PI * (baseFreq * 2.02) / sampleRate

                              // Cylinder combustion harmonics + exhaust rumble
                              val v8Harmonic = sin(phase1) * 0.65 + sin(phase2) * 0.35
                              val intakeGrit = (Random.nextFloat() * 2.0 - 1.0) * (0.05 + currentRatioSmooth * 0.12)
                              val sampleVal = (v8Harmonic + intakeGrit) * volume * Short.MAX_VALUE * 0.75
                              buffer[i] = sampleVal.coerceIn(Short.MIN_VALUE.toDouble(), Short.MAX_VALUE.toDouble()).toInt().toShort()
                          }
                          audioTrack?.write(buffer, 0, buffer.size)
                      }
                  }
                  audioThread?.start()
              }

              private fun hapticPulse(ratio: Float) {
                  if (!Prefs.vibration || ratio < 0.12f) return
                  val v = getSystemService(Vibrator::class.java) ?: return
                  if (Build.VERSION.SDK_INT >= 26) {
                      val intensity = (ratio * 255).toInt().coerceIn(20, 255)
                      v.vibrate(VibrationEffect.createOneShot(18, intensity))
                  }
              }

              private fun playTurboBlowoff() {
                  Thread {
                      val sampleRate = 22050
                      val blowTrack = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).setUsage(AudioAttributes.USAGE_ASSISTANCE_SONIFICATION).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sampleRate).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setBufferSizeInBytes(2048)
                          .build()
                      blowTrack.play()
                      val samples = 3500
                      val buf = ShortArray(samples)
                      for (i in 0 until samples) {
                          val decay = (1.0 - (i.toDouble() / samples)).pow(2.0)
                          val hiss = (Random.nextFloat() * 2f - 1f) * decay * Short.MAX_VALUE * 0.8
                          buf[i] = hiss.toInt().toShort()
                      }
                      blowTrack.write(buf, 0, samples)
                      blowTrack.stop()
                      blowTrack.release()
                  }.start()
              }

              private fun unlockPhone() {
                  playTurboBlowoff()
                  val km = getSystemService(KeyguardManager::class.java)
                  if (km == null) { finishAndRemoveTask(); return }
                  km.requestDismissKeyguard(this, object : KeyguardManager.KeyguardDismissCallback() {
                      override fun onDismissSucceeded() { finishAndRemoveTask() }
                  })
              }

              override fun onDestroy() {
                  isRunningAudio = false
                  try { unregisterReceiver(receiver) } catch (e: Exception) {}
                  audioTrack?.stop()
                  audioTrack?.release()
                  super.onDestroy()
              }
          }

          @Composable
          fun SupercarDashboard(onUnlock: () -> Unit, onRev: (Float) -> Unit, onRelease: () -> Unit) {
              val ctx = LocalContext.current
              val notifs by NotificationStore.list.collectAsState()
              var hideNotifs by remember { mutableStateOf(false) }
              var revRatio by remember { mutableFloatStateOf(0f) }
              var timeStr by remember { mutableStateOf("") }
              var dateStr by remember { mutableStateOf("") }

              LaunchedEffect(Unit) {
                  while (true) {
                      val cal = Calendar.getInstance()
                      timeStr = SimpleDateFormat("HH:mm", Locale.getDefault()).format(cal.time)
                      dateStr = SimpleDateFormat("EEEE, d MMMM", Locale.getDefault()).format(cal.time)
                      delay(1000)
                  }
              }

              LaunchedEffect(revRatio) {
                  if (revRatio >= 0.98f) {
                      delay(120)
                      onUnlock()
                  }
              }

              Box(modifier = Modifier.fillMaxSize().background(Color(0xFF030305))) {
                  Column(modifier = Modifier.fillMaxSize().padding(14.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                          IconButton(onClick = { hideNotifs = !hideNotifs }) {
                              Icon(if (hideNotifs) Icons.Default.VisibilityOff else Icons.Default.Visibility, "Toggle", tint = Color(0xFF00E5FF))
                          }
                      }

                      Text(timeStr, fontSize = 68.sp, fontWeight = FontWeight.Thin, color = Color.White)
                      Text(dateStr, fontSize = 13.sp, color = Color(0xFF80D8FF), letterSpacing = 1.sp)
                      Spacer(Modifier.height(4.dp))

                      if (!hideNotifs && notifs.isNotEmpty()) {
                          LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth()) {
                              items(notifs) { n ->
                                  Card(modifier = Modifier.fillMaxWidth().padding(vertical = 2.dp), colors = CardDefaults.cardColors(containerColor = Color(0x221DE9B6))) {
                                      Column(modifier = Modifier.padding(8.dp)) {
                                          Text(n.appName, color = Color(0xFF00E5FF), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                                          Text(n.title, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Medium)
                                      }
                                  }
                              }
                          }
                      } else {
                          Spacer(modifier = Modifier.weight(1f))
                      }

                      // Skeuomorphic Dial Display
                      CockpitTachometer(
                          ratio = revRatio,
                          onRatioChange = { r ->
                              revRatio = r
                              onRev(r)
                          },
                          onRelease = {
                              revRatio = 0f
                              onRelease()
                          }
                      )

                      Spacer(Modifier.height(12.dp))

                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(modifier = Modifier.size(52.dp).clip(CircleShape).background(Color(0x2200E5FF)).clickable { onUnlock() }, contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Fingerprint, "Fingerprint", tint = Color(0xFF00E5FF), modifier = Modifier.size(30.dp))
                              }
                              Text("Bypass / PIN", color = Color(0xFFB0BEC5), fontSize = 11.sp)
                          }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(modifier = Modifier.size(52.dp).clip(CircleShape).background(Color(0x22FF1744)).clickable {
                                  ctx.startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:112")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              }, contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Phone, "SOS", tint = Color(0xFFFF1744), modifier = Modifier.size(26.dp))
                              }
                              Text("Emergency", color = Color(0xFFB0BEC5), fontSize = 11.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun CockpitTachometer(ratio: Float, onRatioChange: (Float) -> Unit, onRelease: () -> Unit) {
              val smoothRatio by animateFloatAsState(targetValue = ratio, label = "needle")

              Box(
                  modifier = Modifier
                      .size(290.dp)
                      .pointerInput(Unit) {
                          detectDragGestures(
                              onDrag = { change, _ ->
                                  change.consume()
                                  val center = Offset(size.width / 2f, size.height / 2f)
                                  val touch = change.position
                                  val angleRad = atan2(touch.y - center.y, touch.x - center.x)
                                  var angleDeg = Math.toDegrees(angleRad.toDouble()).toFloat()
                                  if (angleDeg < 0) angleDeg += 360f

                                  val startAngle = 135f
                                  val sweepAngle = 270f
                                  var progress = (angleDeg - startAngle) / sweepAngle
                                  if (progress < 0f && angleDeg < 90f) progress = (angleDeg + 360f - startAngle) / sweepAngle
                                  onRatioChange(progress.coerceIn(0f, 1f))
                              },
                              onDragEnd = { onRelease() },
                              onDragCancel = { onRelease() }
                          )
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width
                      val center = Offset(w / 2f, w / 2f)
                      val outerRadius = w / 2f - 8.dp.toPx()

                      // 1. Brushed Chrome Bezel Ring
                      drawCircle(
                          brush = Brush.sweepGradient(listOf(Color(0xFF546E7A), Color(0xFFB0BEC5), Color(0xFF263238), Color(0xFFCFD8DC), Color(0xFF37474F))),
                          radius = outerRadius
                      )
                      drawCircle(color = Color(0xFF0D1117), radius = outerRadius - 10.dp.toPx())

                      // 2. Carbon Fiber Textured Plate
                      val dialRadius = outerRadius - 12.dp.toPx()
                      drawCircle(color = Color(0xFF11141A), radius = dialRadius)
                      for (y in (-dialRadius.toInt()..dialRadius.toInt() step 12)) {
                          drawLine(
                              color = Color(0x15FFFFFF),
                              start = Offset(center.x - dialRadius, center.y + y),
                              end = Offset(center.x + dialRadius, center.y + y),
                              strokeWidth = 2f
                          )
                      }

                      // 3. Gauge Neon Track
                      val startAngle = 135f
                      val sweep = 270f
                      drawArc(
                          color = Color(0xFF1E2630),
                          startAngle = startAngle,
                          sweepAngle = sweep,
                          useCenter = false,
                          style = Stroke(width = 10.dp.toPx(), cap = StrokeCap.Round)
                      )

                      // 4. Dynamic Supercar Power Arc (Cyan -> Amber -> Fiery Crimson)
                      val activeSweep = sweep * smoothRatio
                      drawArc(
                          brush = Brush.sweepGradient(listOf(Color(0xFF00E5FF), Color(0xFFFF9100), Color(0xFFFF1744))),
                          startAngle = startAngle,
                          sweepAngle = activeSweep,
                          useCenter = false,
                          style = Stroke(width = 11.dp.toPx(), cap = StrokeCap.Round)
                      )

                      // 5. RPM Markers & Numbers (0 to 8 x1000 RPM)
                      for (i in 0..8) {
                          val r = i / 8f
                          val a = Math.toRadians((startAngle + (sweep * r)).toDouble())
                          val outer = Offset(center.x + (dialRadius - 8.dp.toPx()) * cos(a).toFloat(), center.y + (dialRadius - 8.dp.toPx()) * sin(a).toFloat())
                          val inner = Offset(center.x + (dialRadius - 22.dp.toPx()) * cos(a).toFloat(), center.y + (dialRadius - 22.dp.toPx()) * sin(a).toFloat())
                          val tickColor = if (i >= 6) Color(0xFFFF1744) else Color(0xFFECEFF1)
                          drawLine(tickColor, inner, outer, strokeWidth = 3.dp.toPx(), cap = StrokeCap.Round)

                          val textPos = Offset(center.x + (dialRadius - 38.dp.toPx()) * cos(a).toFloat(), center.y + (dialRadius - 38.dp.toPx()) * sin(a).toFloat() + 4.dp.toPx())
                          drawIntoCanvas { canvas ->
                              val p = Paint().apply {
                                  color = if (i >= 6) android.graphics.Color.RED else android.graphics.Color.WHITE
                                  textSize = 26f
                                  textAlign = Paint.Align.CENTER
                                  typeface = Typeface.DEFAULT_BOLD
                              }
                              canvas.nativeCanvas.drawText("$i", textPos.x, textPos.y, p)
                          }
                      }

                      // 6. 3D Glowing Needle with Drop Shadow
                      val needleAngle = Math.toRadians((startAngle + (sweep * smoothRatio)).toDouble())
                      val needleEnd = Offset(center.x + (dialRadius - 14.dp.toPx()) * cos(needleAngle).toFloat(), center.y + (dialRadius - 14.dp.toPx()) * sin(needleAngle).toFloat())
                      drawLine(
                          color = Color(0x77000000),
                          start = Offset(center.x + 3.dp.toPx(), center.y + 4.dp.toPx()),
                          end = Offset(needleEnd.x + 3.dp.toPx(), needleEnd.y + 4.dp.toPx()),
                          strokeWidth = 6.dp.toPx(),
                          cap = StrokeCap.Round
                      )
                      val needleGlow = if (smoothRatio > 0.75f) Color(0xFFFF1744) else Color(0xFF00E5FF)
                      drawLine(needleGlow, center, needleEnd, strokeWidth = 5.dp.toPx(), cap = StrokeCap.Round)

                      // Metallic Center Hub
                      drawCircle(Color(0xFF37474F), radius = 16.dp.toPx())
                      drawCircle(Color(0xFFCFD8DC), radius = 10.dp.toPx())
                      drawCircle(needleGlow, radius = 5.dp.toPx())

                      // 7. Center Cockpit Telemetry (Gear & Boost)
                      drawIntoCanvas { canvas ->
                          val gear = when {
                              smoothRatio > 0.85f -> "S4"
                              smoothRatio > 0.55f -> "S3"
                              smoothRatio > 0.25f -> "S2"
                              smoothRatio > 0.05f -> "S1"
                              else -> "P"
                          }
                          val p = Paint().apply {
                              color = if (smoothRatio > 0.75f) android.graphics.Color.RED else android.graphics.Color.CYAN
                              textSize = 42f
                              textAlign = Paint.Align.CENTER
                              typeface = Typeface.DEFAULT_BOLD
                          }
                          canvas.nativeCanvas.drawText("GEAR $gear", center.x, center.y + 46.dp.toPx(), p)
                          p.textSize = 20f
                          p.color = android.graphics.Color.LTGRAY
                          val boost = String.format(Locale.US, "TURBO: %.1f BAR", smoothRatio * 2.2)
                          canvas.nativeCanvas.drawText(boost, center.x, center.y + 64.dp.toPx(), p)
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oppo-find5-supercar-apk
          path: app/build/outputs/apk/debug/*.apk
