          EOF

          cat > app/src/main/java/com/odometer/lock/LockActivity.kt << 'EOF'
          package com.odometer.lock

          import android.app.KeyguardManager
          import android.content.*
          import android.graphics.Paint
          import android.media.*
          import android.net.Uri
          import android.os.*
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.drawIntoCanvas
          import androidx.compose.ui.graphics.nativeCanvas
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.*

          class LockActivity : ComponentActivity() {
              private var audioTrack: AudioTrack? = null
              private var isPlayingAudio = false
              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { finishAndRemoveTask() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true) }
                  else {
                      @Suppress("DEPRECATION")
                      window.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON)
                  }
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) { override fun handleOnBackPressed() {} })
                  val filter = IntentFilter().apply { addAction(Intent.ACTION_USER_PRESENT); addAction(Intent.ACTION_SCREEN_OFF) }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(receiver, filter)

                  initEngineSound()

                  setContent {
                      OppoLockScreen(
                          onUnlock = { unlockPhone() },
                          onRevEngine = { ratio -> playEngineSound(ratio) },
                          onStopRev = { stopEngineSound() }
                      )
                  }
              }

              private fun initEngineSound() {
                  val sampleRate = 22050
                  val bufSize = AudioTrack.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  audioTrack = AudioTrack.Builder()
                      .setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).setUsage(AudioAttributes.USAGE_ASSISTANCE_SONIFICATION).build())
                      .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sampleRate).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                      .setBufferSizeInBytes(bufSize)
                      .build()
              }

              private fun playEngineSound(ratio: Float) {
                  if (!Prefs.sound) return
                  val baseFreq = 70.0 + (ratio * 380.0)
                  val sampleRate = 22050
                  val samples = 1024
                  val buffer = ShortArray(samples)
                  for (i in 0 until samples) {
                      val angle = 2.0 * Math.PI * i / (sampleRate / baseFreq)
                      val sample = (sin(angle) * 0.7 + sin(angle * 2.0) * 0.3) * Short.MAX_VALUE * (0.3 + ratio * 0.7)
                      buffer[i] = sample.toInt().toShort()
                  }
                  try {
                      if (audioTrack?.playState != AudioTrack.PLAYSTATE_PLAYING) audioTrack?.play()
                      audioTrack?.write(buffer, 0, samples, AudioTrack.WRITE_NON_BLOCKING)
                  } catch (e: Exception) {}

                  if (Prefs.vibration && ratio > 0.15f) {
                      val v = getSystemService(Vibrator::class.java)
                      val amp = (ratio * 255).toInt().coerceIn(10, 255)
                      if (Build.VERSION.SDK_INT >= 26) {
                          v?.vibrate(VibrationEffect.createOneShot(25, amp))
                      }
                  }
              }

              private fun stopEngineSound() {
                  try {
                      audioTrack?.pause()
                      audioTrack?.flush()
                  } catch (e: Exception) {}
              }

              private fun unlockPhone() {
                  stopEngineSound()
                  val km = getSystemService(KeyguardManager::class.java)
                  if (km == null) { finishAndRemoveTask(); return }
                  km.requestDismissKeyguard(this, object : KeyguardManager.KeyguardDismissCallback() {
                      override fun onDismissSucceeded() { finishAndRemoveTask() }
                  })
              }

              override fun onDestroy() {
                  try { unregisterReceiver(receiver) } catch (e: Exception) {}
                  stopEngineSound()
                  audioTrack?.release()
                  super.onDestroy()
              }
          }

          @Composable
          fun OppoLockScreen(onUnlock: () -> Unit, onRevEngine: (Float) -> Unit, onStopRev: () -> Unit) {
              val ctx = LocalContext.current
              val notifs by NotificationStore.list.collectAsState()
              var hideNotifs by remember { mutableStateOf(false) }
              var currentRatio by remember { mutableFloatStateOf(0f) }
              var timeStr by remember { mutableStateOf("") }
              var dateStr by remember { mutableStateOf("") }

              LaunchedEffect(Unit) {
                  while (true) {
                      val cal = Calendar.getInstance()
                      timeStr = SimpleDateFormat("HH:mm", Locale.getDefault()).format(cal.time)
                      dateStr = SimpleDateFormat("EEEE, d MMMM", Locale.getDefault()).format(cal.time)
                      delay(1000)
                  }
              }

              LaunchedEffect(currentRatio) {
                  if (currentRatio >= 0.98f) {
                      delay(150)
                      onUnlock()
                  }
              }

              Box(modifier = Modifier.fillMaxSize().background(Color(0xFF070709))) {
                  Column(modifier = Modifier.fillMaxSize().padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                          IconButton(onClick = { hideNotifs = !hideNotifs }) {
                              Icon(if (hideNotifs) Icons.Default.VisibilityOff else Icons.Default.Visibility, "Toggle", tint = Color(0xFFFF5722))
                          }
                      }

                      Text(timeStr, fontSize = 72.sp, fontWeight = FontWeight.ExtraLight, color = Color.White)
                      Text(dateStr, fontSize = 14.sp, color = Color(0xFF9E9E9E))
                      Spacer(Modifier.height(8.dp))

                      if (!hideNotifs && notifs.isNotEmpty()) {
                          LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth()) {
                              items(notifs) { n ->
                                  Card(modifier = Modifier.fillMaxWidth().padding(vertical = 3.dp), colors = CardDefaults.cardColors(containerColor = Color(0x1AFFFFFF))) {
                                      Column(modifier = Modifier.padding(10.dp)) {
                                          Text(n.appName, color = Color(0xFFFF5722), fontSize = 11.sp)
                                          Text(n.title, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                          if (Prefs.showContent && n.text.isNotEmpty()) Text(n.text, color = Color(0xFFAAAAAA), fontSize = 11.sp)
                                      }
                                  }
                              }
                          }
                      } else {
                          Spacer(modifier = Modifier.weight(1f))
                      }

                      Text("OPPO X909 SPEEDOMETER", color = Color(0xFF757575), fontSize = 11.sp, letterSpacing = 2.sp)
                      Text("Drag needle to REDLINE to unlock", color = Color(0xFFFF5722), fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                      Spacer(Modifier.height(8.dp))

                      OppoSpeedometer(
                          ratio = currentRatio,
                          onRatioChange = { r ->
                              currentRatio = r
                              if (r > 0f) onRevEngine(r) else onStopRev()
                          },
                          onRelease = {
                              currentRatio = 0f
                              onStopRev()
                          }
                      )

                      Spacer(Modifier.height(14.dp))
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(modifier = Modifier.size(54.dp).clip(CircleShape).background(Color(0x22FF5722)).clickable { onUnlock() }, contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Fingerprint, "Fingerprint", tint = Color(0xFFFF5722), modifier = Modifier.size(32.dp))
                              }
                              Text("Fingerprint", color = Color(0xFFAAAAAA), fontSize = 11.sp)
                          }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(modifier = Modifier.size(54.dp).clip(CircleShape).background(Color(0x22FF3D00)).clickable {
                                  ctx.startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:112")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              }, contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Phone, "SOS", tint = Color(0xFFFF3D00), modifier = Modifier.size(26.dp))
                              }
                              Text("Emergency", color = Color(0xFFAAAAAA), fontSize = 11.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun OppoSpeedometer(ratio: Float, onRatioChange: (Float) -> Unit, onRelease: () -> Unit) {
              val animatedRatio by animateFloatAsState(targetValue = ratio, label = "needle")
              Box(
                  modifier = Modifier
                      .size(270.dp)
                      .pointerInput(Unit) {
                          detectDragGestures(
                              onDrag = { change, _ ->
                                  change.consume()
                                  val center = Offset(size.width / 2f, size.height / 2f)
                                  val touch = change.position
                                  val angleRad = atan2(touch.y - center.y, touch.x - center.x)
                                  var angleDeg = Math.toDegrees(angleRad.toDouble()).toFloat()
                                  if (angleDeg < 0) angleDeg += 360f

                                  val startAngle = 140f
                                  val sweepAngle = 260f
                                  var progress = (angleDeg - startAngle) / sweepAngle
                                  if (progress < 0f && angleDeg < 90f) progress = (angleDeg + 360f - startAngle) / sweepAngle
                                  onRatioChange(progress.coerceIn(0f, 1f))
                              },
                              onDragEnd = { onRelease() },
                              onDragCancel = { onRelease() }
                          )
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width
                      val h = size.height
                      val center = Offset(w / 2f, h / 2f)
                      val radius = (w / 2f) - 24.dp.toPx()

                      drawCircle(color = Color(0xFF141519), radius = radius + 16.dp.toPx())
                      drawCircle(color = Color(0xFF0C0D10), radius = radius)

                      val startAngle = 140f
                      val sweep = 260f

                      drawArc(
                          color = Color(0xFF263238),
                          startAngle = startAngle,
                          sweepAngle = sweep,
                          useCenter = false,
                          style = Stroke(width = 12.dp.toPx(), cap = StrokeCap.Round)
                      )

                      val activeSweep = sweep * animatedRatio
                      val activeColor = if (animatedRatio > 0.8f) Color(0xFFFF1744) else Color(0xFFFF5722)
                      drawArc(
                          brush = Brush.sweepGradient(listOf(Color(0xFFFF9800), Color(0xFFFF5722), Color(0xFFFF1744))),
                          startAngle = startAngle,
                          sweepAngle = activeSweep,
                          useCenter = false,
                          style = Stroke(width = 12.dp.toPx(), cap = StrokeCap.Round)
                      )

                      for (i in 0..8) {
                          val tickRatio = i / 8f
                          val angle = Math.toRadians((startAngle + (sweep * tickRatio)).toDouble())
                          val outer = Offset(center.x + (radius - 6.dp.toPx()) * cos(angle).toFloat(), center.y + (radius - 6.dp.toPx()) * sin(angle).toFloat())
                          val inner = Offset(center.x + (radius - 20.dp.toPx()) * cos(angle).toFloat(), center.y + (radius - 20.dp.toPx()) * sin(angle).toFloat())
                          val tickColor = if (i >= 7) Color(0xFFFF1744) else Color(0xFFECEFF1)
                          drawLine(color = tickColor, start = inner, end = outer, strokeWidth = 3.dp.toPx(), cap = StrokeCap.Round)

                          val textPos = Offset(center.x + (radius - 34.dp.toPx()) * cos(angle).toFloat(), center.y + (radius - 34.dp.toPx()) * sin(angle).toFloat() + 4.dp.toPx())
                          drawIntoCanvas { canvas ->
                              val p = Paint().apply {
                                  color = if (i >= 7) android.graphics.Color.RED else android.graphics.Color.WHITE
                                  textSize = 28f
                                  textAlign = Paint.Align.CENTER
                                  isFakeBoldText = true
                              }
                              canvas.nativeCanvas.drawText("$i", textPos.x, textPos.y, p)
                          }
                      }

                      val needleAngle = Math.toRadians((startAngle + (sweep * animatedRatio)).toDouble())
                      val needleEnd = Offset(center.x + (radius - 12.dp.toPx()) * cos(needleAngle).toFloat(), center.y + (radius - 12.dp.toPx()) * sin(needleAngle).toFloat())
                      drawLine(
                          color = if (animatedRatio > 0.8f) Color(0xFFFF1744) else Color(0xFFFF3D00),
                          start = center,
                          end = needleEnd,
                          strokeWidth = 5.dp.toPx(),
                          cap = StrokeCap.Round
                      )
                      drawCircle(color = Color(0xFF212121), radius = 14.dp.toPx())
                      drawCircle(color = Color(0xFFFF3D00), radius = 6.dp.toPx())

                      drawIntoCanvas { canvas ->
                          val speedKmh = (animatedRatio * 260).toInt()
                          val p = Paint().apply {
                              color = android.graphics.Color.WHITE
                              textSize = 54f
                              textAlign = Paint.Align.CENTER
                              isFakeBoldText = true
                          }
                          canvas.nativeCanvas.drawText("$speedKmh", center.x, center.y + 45.dp.toPx(), p)
                          p.textSize = 22f
                          p.color = android.graphics.Color.GRAY
                          canvas.nativeCanvas.drawText("km/h - x1000r/min", center.x, center.y + 60.dp.toPx(), p)
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oppo-find5-lock-apk
          path: app/build/outputs/apk/debug/*.apk
