name: Build Odometer Lock

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/odometer/lock
          mkdir -p app/src/main/res/values

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "OdometerLock"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.odometer.lock'
              compileSdk 34
              defaultConfig {
                  applicationId "com.odometer.lock"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion = '1.5.8' }
          }
          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:name=".LockApp"
                  android:label="Oppo Supercar Lock"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".LockActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleInstance"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true" />
                  <service
                      android:name=".LockScreenService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="lock_screen" />
                  </service>
                  <service
                      android:name=".NotificationService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Oppo Supercar Lock</string></resources>
          EOF

          cat > app/src/main/java/com/odometer/lock/Core.kt << 'EOF'
          package com.odometer.lock

          import android.app.*
          import android.content.*
          import android.os.*
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.asStateFlow

          class LockApp : Application() {
              override fun onCreate() { super.onCreate(); Prefs.init(this) }
          }

          object Prefs {
              private lateinit var sp: SharedPreferences
              fun init(c: Context) { sp = c.getSharedPreferences("oppo_prefs", Context.MODE_PRIVATE) }
              var sound: Boolean get() = sp.getBoolean("snd", true); set(v) = sp.edit().putBoolean("snd", v).apply()
              var vibration: Boolean get() = sp.getBoolean("vib", true); set(v) = sp.edit().putBoolean("vib", v).apply()
              var showContent: Boolean get() = sp.getBoolean("cnt", true); set(v) = sp.edit().putBoolean("cnt", v).apply()
          }

          data class LockNotification(val key: String, val appName: String, val title: String, val text: String)

          object NotificationStore {
              private val _list = MutableStateFlow<List<LockNotification>>(emptyList())
              val list = _list.asStateFlow()
              fun add(n: LockNotification) {
                  val cur = _list.value.toMutableList()
                  val idx = cur.indexOfFirst { it.key == n.key }
                  if (idx >= 0) cur[idx] = n else cur.add(0, n)
                  _list.value = cur.take(10)
              }
              fun remove(key: String) { _list.value = _list.value.filterNot { it.key == key } }
          }

          class NotificationService : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName || (sbn.notification.flags and Notification.FLAG_ONGOING_EVENT != 0)) return
                  val title = sbn.notification.extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = sbn.notification.extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val name = try { packageManager.getApplicationLabel(packageManager.getApplicationInfo(sbn.packageName, 0)).toString() } catch (e: Exception) { sbn.packageName }
                  NotificationStore.add(LockNotification(sbn.key ?: "", name, title, text))
              }
              override fun onNotificationRemoved(sbn: StatusBarNotification) { NotificationStore.remove(sbn.key ?: "") }
          }

          class LockScreenService : Service() {
              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action == Intent.ACTION_SCREEN_ON) {
                          val km = getSystemService(KeyguardManager::class.java)
                          if (km?.isKeyguardLocked == true) {
                              startActivity(Intent(context, LockActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                              })
                          }
                      }
                  }
              }
              override fun onCreate() {
                  super.onCreate()
                  val chanId = "oppo_lock_chan"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(
                          NotificationChannel(chanId, "Supercar Lock", NotificationManager.IMPORTANCE_MIN)
                      )
                  }
                  startForeground(1, NotificationCompat.Builder(this, chanId)
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setContentTitle("Supercar Lock Active").build())
                  val filter = IntentFilter(Intent.ACTION_SCREEN_ON)
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(receiver, filter)
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int) = START_STICKY
              override fun onBind(intent: Intent?) = null
              override fun onDestroy() { try { unregisterReceiver(receiver) } catch (e: Exception) {}; super.onDestroy() }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val i = Intent(context, LockScreenService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(i) else context.startService(i)
              }
          }
          EOF

          cat > app/src/main/java/com/odometer/lock/MainActivity.kt << 'EOF'
          package com.odometer.lock

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val ctx = LocalContext.current
                      var hasOverlay by remember { mutableStateOf(Settings.canDrawOverlays(ctx)) }
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              Column(modifier = Modifier.padding(24.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                                  Text("OPPO Find 5 Car Lock", style = MaterialTheme.typography.headlineMedium)
                                  Text("Tachometer lock screen with live revving sound & vibration.")

                                  Button(onClick = {
                                      ctx.startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:${ctx.packageName}")))
                                  }, modifier = Modifier.fillMaxWidth()) {
                                      Text(if (hasOverlay) "✓ Overlay Granted" else "1. Grant Overlay Permission")
                                  }

                                  Button(onClick = {
                                      ctx.startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                                  }, modifier = Modifier.fillMaxWidth()) {
                                      Text("2. Grant Notification Access")
                                  }

                                  HorizontalDivider()

                                  Button(onClick = {
                                      val i = Intent(ctx, LockScreenService::class.java)
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i) else ctx.startService(i)
                                  }, modifier = Modifier.fillMaxWidth()) { Text("Start Lock Service") }

                                  Button(onClick = {
                                      ctx.startActivity(Intent(ctx, LockActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                                  }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary)) {
                                      Text("Preview Oppo Tachometer Lock")
