          package com.odometer.lock

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.odometer.lock.ui.OdometerTheme

          class SettingsActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { OdometerTheme { SettingsScreen() } }
              }
          }

          @Composable
          fun SettingsScreen() {
              var maxValue by remember { mutableFloatStateOf(Prefs.maxValue.toFloat()) }
              var vibration by remember { mutableStateOf(Prefs.vibrationEnabled) }
              var sound by remember { mutableStateOf(Prefs.soundEnabled) }
              var showContent by remember { mutableStateOf(Prefs.showNotificationContent) }
              var lockEnabled by remember { mutableStateOf(Prefs.lockEnabled) }

              Surface(modifier = Modifier.fillMaxSize()) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(24.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Text("Settings", style = MaterialTheme.typography.headlineLarge)

                      Card(modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("Max odometer value: " + maxValue.toInt(),
                                  style = MaterialTheme.typography.titleMedium)
                              Slider(
                                  value = maxValue,
                                  onValueChange = {
                                      maxValue = it
                                      Prefs.maxValue = it.toInt().coerceAtLeast(10)
                                  },
                                  valueRange = 10f..99999f
                              )
                          }
                      }

                      SwitchRow("Vibration", vibration) { vibration = it; Prefs.vibrationEnabled = it }
                      SwitchRow("Sound", sound) { sound = it; Prefs.soundEnabled = it }
                      SwitchRow("Show notification content", showContent) {
                          showContent = it; Prefs.showNotificationContent = it
                      }
                      SwitchRow("Lock screen enabled", lockEnabled) {
                          lockEnabled = it; Prefs.lockEnabled = it
                      }

                      Button(
                          onClick = { Prefs.resetOdometer() },
                          modifier = Modifier.fillMaxWidth()
                      ) { Text("Reset odometer to 0") }
                  }
              }
          }

          @Composable
          fun SwitchRow(label: String, checked: Boolean, onChange: (Boolean) -> Unit) {
              Card(modifier = Modifier.fillMaxWidth()) {
                  Row(
