              Surface(modifier = Modifier.fillMaxSize()) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(24.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Text("Odometer Lock", style = MaterialTheme.typography.headlineLarge)
                      Text(
                          "Lock screen replacement with a car odometer. Grant permissions, then start the service.",
                          style = MaterialTheme.typography.bodyMedium
                      )
                      HorizontalDivider()

                      PermissionRow("Draw over other apps", overlayGranted) {
                          context.startActivity(Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + context.packageName)
                          ))
                      }
                      PermissionRow("Notifications", notifGranted) {
                          context.startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                              .setData(Uri.parse("package:" + context.packageName)))
                      }
                      PermissionRow("Notification access", isNotificationListenerEnabled(context)) {
                          context.startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                      }

                      HorizontalDivider()

                      Button(
                          onClick = { LockScreenService.start(context) },
                          modifier = Modifier.fillMaxWidth()
                      ) { Text("Start lock screen") }

                      Button(
                          onClick = { LockScreenService.stop(context) },
                          modifier = Modifier.fillMaxWidth(),
                          colors = ButtonDefaults.buttonColors(
                              containerColor = MaterialTheme.colorScheme.errorContainer,
                              contentColor = MaterialTheme.colorScheme.onErrorContainer
                          )
                      ) { Text("Stop lock screen") }

                      Button(
                          onClick = { context.startActivity(Intent(context, SettingsActivity::class.java)) },
                          modifier = Modifier.fillMaxWidth(),
                          colors = ButtonDefaults.buttonColors(
                              containerColor = MaterialTheme.colorScheme.secondaryContainer,
                              contentColor = MaterialTheme.colorScheme.onSecondaryContainer
                          )
                      ) { Text("Settings") }

                      Button(
                          onClick = {
                              context.startActivity(
                                  Intent(context, LockActivity::class.java)
                                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              )
                          },
                          modifier = Modifier.fillMaxWidth(),
                          colors = ButtonDefaults.buttonColors(
                              containerColor = MaterialTheme.colorScheme.tertiaryContainer,
                              contentColor = MaterialTheme.colorScheme.onTertiaryContainer
                          )
                      ) { Text("Preview lock screen") }
                  }
              }
          }

          @Composable
          fun PermissionRow(title: String, granted: Boolean, onGrant: () -> Unit) {
              Card(
                  modifier = Modifier.fillMaxWidth(),
                  colors = CardDefaults.cardColors(
                      containerColor = if (granted) MaterialTheme.colorScheme.primaryContainer
                                       else MaterialTheme.colorScheme.surfaceVariant
                  )
              ) {
                  Row(
                      modifier = Modifier.padding(16.dp).fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(modifier = Modifier.weight(1f)) {
                          Text(title, style = MaterialTheme.typography.bodyLarge)
                          Text(if (granted) "GRANTED" else "NOT GRANTED",
                              style = MaterialTheme.typography.bodySmall)
                      }
                      if (!granted) TextButton(onClick = onGrant) { Text("GRANT") }
                  }
              }
          }

          fun isNotificationListenerEnabled(context: Context): Boolean {
              val flat = Settings.Secure.getString(
                  context.contentResolver, "enabled_notification_listeners"
              )
              return flat?.contains(context.packageName) == true
          }
