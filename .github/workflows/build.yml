          cat > app/src/main/java/com/odometer/lock/LockScreenService.kt << '__F10__'
          package com.odometer.lock

          import android.app.KeyguardManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat

          class LockScreenService : Service() {
              private val screenReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action == Intent.ACTION_SCREEN_ON && Prefs.lockEnabled) {
                          val km = getSystemService(KeyguardManager::class.java)
                          if (km?.isKeyguardLocked == true) launchLock()
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  startForeground(NOTIFICATION_ID, buildNotification())
                  val filter = IntentFilter(Intent.ACTION_SCREEN_ON)
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(screenReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      @Suppress("DEPRECATION")
                      registerReceiver(screenReceiver, filter)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int) = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  try { unregisterReceiver(screenReceiver) } catch (e: Exception) {}
                  super.onDestroy()
              }

              private fun launchLock() {
                  try {
                      startActivity(
                          Intent(this, LockActivity::class.java).apply {
                              addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK or
                                  Intent.FLAG_ACTIVITY_SINGLE_TOP or
                                  Intent.FLAG_ACTIVITY_CLEAR_TOP
                              )
                          }
                      )
                  } catch (e: Exception) {}
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(
                          NotificationChannel(
                              CHANNEL_ID, "Odometer Lock", NotificationManager.IMPORTANCE_MIN
                          ).apply { setShowBadge(false) }
                      )
                  }
              }

              private fun buildNotification(): Notification {
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setContentTitle("Odometer Lock active")
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .build()
              }

              companion object {
                  private const val CHANNEL_ID = "lock_screen_service"
                  private const val NOTIFICATION_ID = 1001

                  fun start(context: Context) {
                      val intent = Intent(context, LockScreenService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          context.startForegroundService(intent)
                      else context.startService(intent)
                  }

                  fun stop(context: Context) {
                      context.stopService(Intent(context, LockScreenService::class.java))
                  }
              }
          }
