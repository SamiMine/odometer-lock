          package com.odometer.lock

          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow

          data class LockNotification(
              val key: String,
              val packageName: String,
              val appName: String,
              val title: String,
              val text: String,
              val postedTime: Long
          )

          object NotificationStore {
              private val _notifications = MutableStateFlow<List<LockNotification>>(emptyList())
              val notifications: StateFlow<List<LockNotification>> = _notifications.asStateFlow()

              fun addOrUpdate(n: LockNotification) {
                  val current = _notifications.value.toMutableList()
                  val i = current.indexOfFirst { it.key == n.key }
                  if (i >= 0) current[i] = n else current.add(0, n)
                  _notifications.value = current.take(20)
              }

              fun remove(key: String) {
                  _notifications.value = _notifications.value.filterNot { it.key == key }
              }

              fun clear() { _notifications.value = emptyList() }
          }
