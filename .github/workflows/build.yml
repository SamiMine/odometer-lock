          cat > app/src/main/java/com/odometer/lock/LockActivity.kt << '__F13__'
          package com.odometer.lock

          import android.app.KeyguardManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.compose.setContent
          import com.odometer.lock.ui.LockScreenUi
          import com.odometer.lock.ui.OdometerTheme

          class LockActivity : ComponentActivity() {
              private var toneGenerator: ToneGenerator? = null

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      when (intent.action) {
                          Intent.ACTION_USER_PRESENT -> finishAndRemoveTask()
                          Intent.ACTION_SCREEN_OFF -> finishAndRemoveTask()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                  } else {
                      @Suppress("DEPRECATION")
                      window.addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                          WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                      )
                  }
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() { }
                  })

                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_USER_PRESENT)
                      addAction(Intent.ACTION_SCREEN_OFF)
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      @Suppress("DEPRECATION")
                      registerReceiver(receiver, filter)
                  }

                  toneGenerator = try { ToneGenerator(AudioManager.STREAM_SYSTEM, 50) } catch (e: Exception) { null }

                  setContent {
                      OdometerTheme {
                          LockScreenUi(
                              onUnlock = { attemptUnlock() },
                              onStep = { playFeedback() }
                          )
                      }
                  }
              }

              override fun onDestroy() {
                  try { unregisterReceiver(receiver) } catch (e: Exception) {}
                  toneGenerator?.release()
                  super.onDestroy()
              }

              private fun playFeedback() {
                  if (Prefs.vibrationEnabled) vibrate()
                  if (Prefs.soundEnabled) playTick()
              }

              private fun vibrate() {
                  try {
                      val vibrator = if (Build.VERSION.SDK_INT >= 31) {
                          getSystemService(VibratorManager::class.java).defaultVibrator
                      } else {
                          @Suppress("DEPRECATION")
                          getSystemService(Vibrator::class.java)
                      }
                      if (vibrator != null && vibrator.hasVibrator()) {
                          vibrator.vibrate(VibrationEffect.createOneShot(15, VibrationEffect.DEFAULT_AMPLITUDE))
                      }
                  } catch (e: Exception) {}
              }

              private fun playTick() {
                  try { toneGenerator?.startTone(ToneGenerator.TONE_PROP_BEEP, 20) } catch (e: Exception) {}
              }

              private fun attemptUnlock() {
                  val km = getSystemService(KeyguardManager::class.java)
                  if (km == null) { finishAndRemoveTask(); return }
                  km.requestDismissKeyguard(this, object : KeyguardManager.KeyguardDismissCallback() {
                      override fun onDismissSucceeded() { finishAndRemoveTask() }
                      override fun onDismissCancelled() {}
                      override fun onDismissError() {}
                  })
              }
          }
